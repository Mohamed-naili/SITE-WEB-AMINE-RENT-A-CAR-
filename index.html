  <style>
    /* =========================================================================

    :root {

    /* =========================================================================
       2. RESET & BASE TYPOGRAPHY
       ========================================================================= */
    *,

    }

    html[lang="ar"] body,

    html[lang="ar"] h2,
    html[lang="ar"] h3,
    html[lang="ar"] button,
    html[lang="ar"] select,

    select,

    }

    [hidden] {

    /* =========================================================================
       3. KEYFRAME ANIMATIONS & SCROLL REVEAL
       ========================================================================= */
    @keyframes floatSlow {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(18px, -16px, 0) scale(1.06);
      }
    }

    @keyframes pulseDot {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.65;
      }
    }

    @keyframes modalRise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-120%) skewX(-18deg);
      }
      100% {
        transform: translateX(240%) skewX(-18deg);
      }
    }

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.65s var(--ease-out), transform 0.65s var(--ease-out);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      .reveal {
        opacity: 1;
        transform: none;
        transition: none;
      }
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.08ms !important;
      }
    }

    .btn {

      align-items: center;

      border-radius: var(--radius-sm);

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      background: rgba(255, 255, 255, 0.22);
      transform: translateX(-140%) skewX(-18deg);
      pointer-events: none;
    }

    .btn:hover:not(:disabled)::after {

    }

    const langIdx = () => Math.max(0, LANGS.indexOf(lang));
    const tr = (key) => {
      const entry = T[key];
      if (!entry) return key;
      return entry[langIdx()] ?? entry[0] ?? key;
    };

    const state = {
      settings: { min_days: "3", whatsapp: WA_DEFAULT, company_phone: "+216 21 289 073" },
      vehicles: [],
      imagesById: {},
      imagesByName: {},
      locations: [],
      availability: [],
      events: {},
      range: { s: "", e: "" },
      monthOffset: 0,
      calMonthOffset: 0,
      resultsShown: false,
      selectedVehicleId: "",
      modalCar: "",
      modalPrice: 0
    };

    const pad2 = (n) => String(n).padStart(2, "0");
    const parseIsoParts = (isoStr) => {
      const [y, m, d] = String(isoStr).split("-").map(Number);
      return { y, m, d };
    };
    const toUtcMidnight = (isoStr) => {
      const { y, m, d } = parseIsoParts(isoStr);
      return Date.UTC(y, m - 1, d);
    };
    const diffDays = (a, b) => Math.round((toUtcMidnight(b) - toUtcMidnight(a)) / 86400000);
    const addDaysIso = (isoStr, deltaDays) =>
      new Date(toUtcMidnight(isoStr) + deltaDays * 86400000).toISOString().slice(0, 10);
    const tunisDate = (d) => new Date(d).toLocaleDateString("sv-SE", { timeZone: "Africa/Tunis" });
    const localIso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const todayIso = () => tunisDate(new Date());
    const minRentalDays = () => Math.max(1, Number(state.settings.min_days) || 3);
    const fmtDate = (isoStr) =>
      new Date(toUtcMidnight(isoStr)).toLocaleDateString(LOCALES[lang], {
        day: "numeric",
        month: "short",
        year: "numeric",
        timeZone: "UTC"
      });
    const fmtMoney = (val) => `${Number(val).toFixed(3)} TND`;

    const isVehicleBusy = (veh, startIso, endIso) =>
      state.availability.some(
        (b) => b.vehicle_id === veh.id && tunisDate(b.start_at) < endIso && tunisDate(b.end_at) > startIso
      );

    const activePool = () => {
      const modelVal = $("modelFilter").value;
      return state.vehicles.filter(
        (v) => v.daily_price_htva != null && (!modelVal || v.name === modelVal)
      );
    };

    const isDayFree = (isoDate) => {
      const pool = activePool();
      if (!pool.length) return true;
      return pool.some((v) => !isVehicleBusy(v, isoDate, addDaysIso(isoDate, 1)));
    };

    function setSearchMessage(text) {
      $("searchMsg").textContent = text || "";
    }

    function getVehicleImageSrc(veh) {
      if (veh && veh.id && state.imagesById[veh.id]) {
        return `${IMG_BUCKET_URL}${state.imagesById[veh.id]}`;
      }
      if (veh && veh.name && state.imagesByName[veh.name]) {
        return state.imagesByName[veh.name];
      }
      return "";
    }

    function renderVehicleMedia(veh, altText, imgClass = "car-media") {
      const src = getVehicleImageSrc(veh);
      if (src) {
        return `<img class="${imgClass}" loading="lazy" src="${esc(src)}" alt="${esc(altText)}" />`;
      }
      return `<div class="car-ph">${esc(altText)}</div>`;
    }

    /* =========================================================================
       4. RANGE CALENDAR & SEARCH RESULTS
       ========================================================================= */
    function renderRangeCalendar() {
      const today = todayIso();
      const { y: ty, m: tm } = parseIsoParts(today);
      let html = "";

      for (let k = 0; k < 2; k++) {
        const mDate = new Date(Date.UTC(ty, tm - 1 + state.monthOffset + k, 1));
        const y = mDate.getUTCFullYear();
        const m = mDate.getUTCMonth();
        const daysInMonth = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
        const monthTitle = mDate.toLocaleDateString(LOCALES[lang], {
          month: "long",
          year: "numeric",
          timeZone: "UTC"
        });

        html += `<div class="month-card"><h3>${esc(monthTitle)}</h3><div class="days-grid">`;
        for (let w = 0; w < 7; w++) {
          const wd = new Date(Date.UTC(2024, 0, 1 + w)).toLocaleDateString(LOCALES[lang], {
            weekday: "narrow",
            timeZone: "UTC"
          });
          html += `<b>${esc(wd)}</b>`;
        }

        const leadingBlanks = (mDate.getUTCDay() + 6) % 7;
        for (let b = 0; b < leadingBlanks; b++) {
          html += `<i></i>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dStr = `${y}-${pad2(m + 1)}-${pad2(day)}`;
          const past = dStr < today;
          const free = !past && isDayFree(dStr);
          const ev = state.events[dStr];

          let cls = "";
          if (past) cls = "is-past";
          else if (!free) cls = "is-busy";
          else if (dStr === state.range.s || dStr === state.range.e) cls = "is-selected";
          else if (state.range.s && state.range.e && dStr > state.range.s && dStr < state.range.e) {
            cls = "is-between";
          }

          const evLabel = ev ? ev[`label_${lang}`] || ev.label_fr || "" : "";
          const titleAttr = evLabel ? ` title="${esc(evLabel)}"` : "";
          const dotHtml = evLabel ? "<u></u>" : "";
          const disabledAttr = past || !free ? " disabled" : "";

          html += `<button type="button" class="day-btn ${cls}" data-date="${dStr}"${disabledAttr}${titleAttr}>${day}${dotHtml}</button>`;
        }

        html += `</div></div>`;
      }

      $("rangeCal").innerHTML = html;
      $("prevMonth").disabled = state.monthOffset <= 0;
      $("nextMonth").disabled = state.monthOffset >= 5;

      $("rangeCal").querySelectorAll("[data-date]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const picked = btn.dataset.date;
          if (!state.range.s || state.range.e || picked <= state.range.s) {
            state.range = { s: picked, e: "" };
          } else {
            state.range.e = picked;
          }
          setSearchMessage("");
          renderRangeCalendar();
        });
      });

      $("rangeOut").textContent = state.range.s
        ? `${fmtDate(state.range.s)} – ${state.range.e ? fmtDate(state.range.e) : "..."}`
        : tr("pick");
    }

    function populateModelSelect() {
      const prev = $("modelFilter").value;
      const names = new Set(CATALOG_GROUPS.flatMap((g) => g.cars.map((c) => c[0])));
      state.vehicles.forEach((v) => v.name && names.add(v.name));
      const sorted = [...names].sort();

      $("modelFilter").innerHTML =
        `<option value="">${esc(tr("all"))}</option>` +
        sorted.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
      $("modelFilter").value = prev;
    }

    function renderSearchResults() {
      state.resultsShown = true;
      const filterModel = $("modelFilter").value;
      const grouped = {};

      state.vehicles
        .filter((v) => (!filterModel || v.name === filterModel) && !isVehicleBusy(v, state.range.s, state.range.e))
        .forEach((v) => {
          grouped[v.name] = grouped[v.name] || [];
          grouped[v.name].push(v);
        });

      const days = diffDays(state.range.s, state.range.e);
      const modelNames = Object.keys(grouped);
      const waClean = (state.settings.whatsapp || WA_DEFAULT).replace(/\D/g, "");

      $("resultsSection").hidden = false;

      if (!modelNames.length) {
        $("resultsContainer").innerHTML = `
          <div class="sec-head">
            <h2>${esc(fmtDate(state.range.s))} – ${esc(fmtDate(state.range.e))}</h2>
            <p>${esc(tr("none"))}</p>
          </div>
        `;
        $("resultsSection").scrollIntoView({ behavior: "smooth" });
        return;
      }

      const cardsHtml = modelNames
        .map((modelName) => {
          const units = grouped[modelName];
          const sample = units[0];
          const dailyPrice = sample.daily_price_htva;
          const specsList = [
            sample.transmission,
            sample.fuel,
            sample.seats ? `${sample.seats} ${tr("seats")}` : ""
          ].filter(Boolean);

          const specsHtml = specsList.length
            ? `<div class="specs">${specsList.map((s) => `<span>${esc(s)}</span>`).join("")}</div>`
            : "";

          const priceActionHtml =
            dailyPrice != null
              ? `
                <div>
                  <span class="tn-plate"><b>${esc(Number(dailyPrice))}</b><i>تونس</i><em>TND</em></span>
                  <span class="small-muted">${esc(tr("pd"))}</span>
                </div>
                <p class="small-muted">${esc(
                  tr("tot").replace("{n}", (dailyPrice * days).toFixed(0)).replace("{d}", days)
                )}</p>
                <button class="btn btn-red" type="button" data-book-id="${esc(sample.id)}">${esc(tr("bk"))}</button>
              `
              : `
                <p class="small-muted">${esc(tr("rq"))}</p>
                <a
                  class="btn btn-wa"
                  target="_blank"
                  rel="noopener"
                  href="https://wa.me/${esc(waClean)}?text=${encodeURIComponent(
                    `${modelName} ${state.range.s} -> ${state.range.e}`
                  )}"
                >${esc(tr("wa"))}</a>
              `;

          return `
            <article class="car-card">
              ${renderVehicleMedia(sample, modelName, "car-media")}
              <div class="car-body">
                <div class="car-top">
                  <h3>${esc(modelName)}</h3>
                  <span class="avail-pill">${esc(tr("av").replace("{n}", units.length))}</span>
                </div>
                ${specsHtml}
                ${priceActionHtml}
              </div>
            </article>
          `;
        })
        .join("");

      $("resultsContainer").innerHTML = `
        <div class="sec-head">
          <h2>${esc(fmtDate(state.range.s))} – ${esc(fmtDate(state.range.e))}</h2>
          <p>${esc(`${days} ${tr("days")}`)}</p>
        </div>
        <div class="cars-grid">${cardsHtml}</div>
      `;

      $("resultsContainer").querySelectorAll("[data-book-id]").forEach((btn) => {
        btn.addEventListener("click", () => openServerQuoteDialog(btn.dataset.bookId));
      });

      $("resultsSection").scrollIntoView({ behavior: "smooth" });
    }

    /* =========================================================================
       5. FLEET & VIP CATALOGUE RENDERER
       ========================================================================= */
    function renderFleetCatalogue() {
      const idx = langIdx();
      const locIdx = lang === "ar" ? 1 : 0;

      $("normalFleet").innerHTML = CATALOG_GROUPS.map((grp) => {
        const groupTitle = grp.title[idx] || grp.title[0];
        const itemsHtml = grp.cars
          .map((c) => {
            const [carName, rate, isAvail, descArr] = c;
            const descText = descArr[idx] || descArr[0];
            const vehMatch = state.vehicles.find((v) => v.name === carName);
            const mediaHtml = renderVehicleMedia(
              vehMatch || { name: carName },

              "car-media"
            );

            return `
              <div class="cat-item">
                ${mediaHtml}
                <div class="cat-row">
                  <div>
                    <strong>${esc(carName)}</strong>
                    <small>${esc(descText)}</small>
                  </div>
                  <span class="status-tag ${isAvail ? "ok" : "no"}">${esc(
                    isAvail ? tr("avTag") : tr("naTag")
                  )}</span>
                </div>
                <div class="price-line">${esc(rate)} TND ${esc(tr("day"))}</div>
                <button
                  class="btn btn-dark"
                  type="button"
                  data-quick-car="${esc(carName)}"
                  data-quick-price="${esc(rate)}"
                >${esc(isAvail ? tr("reserveBtn") : tr("waitBtn"))}</button>
              </div>
            `;
          })
          .join("");

        return `
          <div class="cat-box">
            <h3>${esc(groupTitle)}</h3>
            <small class="cat-sub">${esc(grp.price)} TND ${esc(tr("day"))}</small>
            ${itemsHtml}
          </div>
        `;
      }).join("");

      $("vipFleet").innerHTML = VIP_CATALOG.map(([vipName, descArr]) => {
        const descText = descArr[idx] || descArr[0];
        const vehMatch = state.vehicles.find((v) => v.name.toLowerCase().includes(vipName.toLowerCase()));
        const mediaHtml = renderVehicleMedia(
          vehMatch || { name: vipName },
          vipName,
          "car-media"
        );

        return `
          <div class="cat-item">
            ${mediaHtml}

              <div>
                <strong style="color: #fff">${esc(vipName)}</strong>

              </div>
              <span class="status-tag ok">${esc(tr("avTag"))}</span>
            </div>
            <div class="price-line" style="color: var(--gold)">${esc(tr("onReq"))}</div>
            <button
              class="btn btn-gold"
              type="button"
              data-quick-car="${esc(`${vipName} (VIP)`)}"
              data-quick-price="0"
            >${esc(tr("reserveBtn"))}</button>
          </div>

      const locOptions = state.locations.length
        ? state.locations.map((l) => `<option value="${esc(l.name)}">${esc(l.name)}</option>`).join("")
        : DEFAULT_LOCS.map((l) => `<option value="${esc(l[0])}">${esc(l[locIdx])}</option>`).join("");
      $("reqLoc").innerHTML = locOptions;

      document.querySelectorAll("[data-quick-car]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openQuickModal(btn.dataset.quickCar, Number(btn.dataset.quickPrice) || 0);
        });
      });
    }

    /* =========================================================================
       6. MODEL AVAILABILITY CALENDAR
       ========================================================================= */
    function renderModelCalendar() {
      const sel = $("calModelSel");
      const currentChoice = sel.value;
      const allNames = [
        ...CATALOG_GROUPS.flatMap((g) => g.cars.map((c) => c[0])),
        ...VIP_CATALOG.map((v) => v[0])
      ];
      const uniqueNames = [...new Set(allNames)];

      sel.innerHTML = uniqueNames.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
      if (currentChoice && uniqueNames.includes(currentChoice)) {
        sel.value = currentChoice;
      }

      const units = state.vehicles.filter((v) => v.name === sel.value);
      const now = new Date();
      const targetMonth = new Date(now.getFullYear(), now.getMonth() + state.calMonthOffset, 1);

      $("calMonthTitle").textContent = targetMonth.toLocaleDateString(LOCALES[lang], {
        month: "long",
        year: "numeric"
      });

      $("calPrev").disabled = state.calMonthOffset <= 0;
      $("calNext").disabled = state.calMonthOffset >= 4;

      if (!units.length) {
        $("calGrid").innerHTML = "";
        $("calStatusMsg").textContent = tr("calOff");
        return;
      }

      $("calStatusMsg").textContent = "";
      let cells = "";

      for (let k = 0; k < 7; k++) {
        const wd = new Date(2024, 0, 1 + k).toLocaleDateString(LOCALES[lang], { weekday: "short" });
        cells += `<b>${esc(wd)}</b>`;
      }

      const blanks = (targetMonth.getDay() + 6) % 7;
      for (let b = 0; b < blanks; b++) {
        cells += `<i></i>`;
      }

      const dim = new Date(targetMonth.getFullYear(), targetMonth.getMonth() + 1, 0).getDate();
      const todayStr = todayIso();

      for (let d = 1; d <= dim; d++) {
        const ds = localIso(new Date(targetMonth.getFullYear(), targetMonth.getMonth(), d));
        let statusClass = "free";
        if (ds < todayStr) {
          statusClass = "past";
        } else {
          const perUnit = units.map((u) =>
            state.availability.filter(
              (b) => b.vehicle_id === u.id && tunisDate(b.start_at) <= ds && ds < tunisDate(b.end_at)
            )
          );
          if (perUnit.some((arr) => !arr.length)) {
            statusClass = "free";
          } else {
            const flat = perUnit.flat();
            if (flat.some((x) => x.state === "reserved")) statusClass = "res";
            else if (flat.some((x) => x.state === "held")) statusClass = "held";
            else statusClass = "na";
          }
        }
        cells += `<span class="${statusClass}">${d}</span>`;
      }

      $("calGrid").innerHTML = cells;
    }

    /* =========================================================================
       7. SERVER QUOTE DIALOG & QUICK BOOKING MODAL
       ========================================================================= */
    const locationNameById = (id) => state.locations.find((l) => l.id === id)?.name || id || "";

    async function openServerQuoteDialog(vehicleId) {
      state.selectedVehicleId = vehicleId;
      const veh = state.vehicles.find((v) => v.id === vehicleId) || { name: "" };

      $("dlgVeh").textContent = veh.name;
      $("dlgDates").textContent = `${fmtDate(state.range.s)} – ${fmtDate(state.range.e)} (${diffDays(
        state.range.s,
        state.range.e
      )} ${tr("days")})`;
      $("dlgLocs").textContent = `${locationNameById($("pickupLoc").value)} / ${locationNameById(
        $("returnLoc").value
      )}`;
      $("dlgMsg").textContent = "";
      $("dlgMsg").className = "";
      $("dlgNote").textContent = tr("est");
      $("dlgQuoteBody").textContent = "...";
      $("dlgConfirm").disabled = true;

      const dlg = $("quoteDlg");
      if (typeof dlg.showModal === "function") {
        dlg.showModal();
      }

      if (!sb) {
        $("dlgQuoteBody").innerHTML = `<p class="msg-bad">${esc(tr("er"))}</p>`;
        return;
      }

      const { data, error } = await sb.rpc("quote_booking", {
        p_vehicle: vehicleId,
        p_start: state.range.s,
        p_end: state.range.e
      });

      if (error || !data || !data.ok) {
        $("dlgQuoteBody").innerHTML = `<p class="msg-bad">${esc(tr("er"))}</p>`;
        return;
      }

      const row = (labelKey, valText, extraCls = "") =>
        `<tr${extraCls ? ` class="${extraCls}"` : ""}><td>${esc(tr(labelKey))}</td><td>${esc(valText)}</td></tr>`;

      const stampRow =
        Number(data.fiscal_stamp) > 0 ? row("st", fmtMoney(data.fiscal_stamp)) : "";
      const taxWarning = data.treatment_confirmed
        ? ""
        : `<p class="small-muted">${esc(tr("tx"))}</p>`;

      $("dlgQuoteBody").innerHTML = `
        <table>
          ${row("s1", fmtMoney(data.subtotal_htva))}
          ${row("lv", fmtMoney(data.levy))}
          ${row("bs", fmtMoney(data.taxable_base))}
          ${row("vt", `${data.vat_rate} % : ${fmtMoney(data.vat_amount)}`)}
          ${stampRow}
          ${row("tt", fmtMoney(data.total_ttc), "total-row")}
          ${row("dp", `${data.deposit_pct} % : ${fmtMoney(data.deposit)}`)}
          ${row("rs", fmtMoney(data.balance))}
        </table>
        ${taxWarning}
      `;
      $("dlgConfirm").disabled = false;
    }

    function updateQuickQuote() {
      const sVal = $("reqStart").value;
      const eVal = $("reqEnd").value;
      const box = $("reqQuoteBox");
      const d = sVal && eVal ? diffDays(sVal, eVal) : 0;

      if (d < minRentalDays()) {
        box.hidden = true;
        return;
      }

      box.hidden = false;
      if (state.modalPrice > 0) {
        box.textContent = tr("estBox")
          .replace("{d}", d)
          .replace("{p}", state.modalPrice)
          .replace("{tot}", d * state.modalPrice);
      } else {
        box.textContent = tr("onReq");
      }
    }

    function openQuickModal(carTitle, dailyRate) {
      state.modalCar = carTitle;
      state.modalPrice = dailyRate;
      $("reqCarName").textContent = carTitle;

      const todayStr = todayIso();
      const minEndStr = addDaysIso(todayStr, minRentalDays());

      $("reqStart").min = todayStr;
      $("reqStart").value = todayStr;
      $("reqEnd").min = minEndStr;
      $("reqEnd").value = minEndStr;

      $("phoneErr").style.display = "none";
      $("dateErr").style.display = "none";
      $("reqSubmitErr").style.display = "none";
      $("reqForm").hidden = false;
      $("reqSuccessBox").hidden = true;

      $("reqModal").classList.add("is-open");
      updateQuickQuote();
      prefillUserProfile();
      setTimeout(() => $("reqName").focus(), 60);
    }

    function closeQuickModal() {
      $("reqModal").classList.remove("is-open");
    }

    async function prefillUserProfile() {
      if (!sb) return;
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return;
        const { data: prof } = await sb
          .from("profiles")
          .select("full_name,phone")
          .eq("id", session.user.id)
          .maybeSingle();
        if (prof) {
          if (prof.full_name && !$("reqName").value) $("reqName").value = prof.full_name;
          if (prof.phone && !$("reqPhone").value) $("reqPhone").value = prof.phone;
        }
      } catch (e) {}
    }

    /* =========================================================================
       8. LANGUAGE APPLICATION, DATA LOADING & ANIMATION OBSERVERS
       ========================================================================= */
    function applyLanguage() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      $("langSel").value = lang;

      document.querySelectorAll("[data-i]").forEach((el) => {
        el.textContent = tr(el.dataset.i);
      });

      populateModelSelect();
      renderRangeCalendar();
      renderFleetCatalogue();
      renderModelCalendar();
      updateQuickQuote();

      if (state.resultsShown && state.range.s && state.range.e) {
        renderSearchResults();
      }
    }

    function syncContactLinks() {
      const phoneRaw = state.settings.company_phone || "+216 21 289 073";
      const waDigits = (state.settings.whatsapp || WA_DEFAULT).replace(/\D/g, "");
      const waHref = `https://wa.me/${waDigits}`;

      $("heroPhone").textContent = phoneRaw;
      $("heroPhone").href = `tel:${phoneRaw.replace(/\s+/g, "")}`;
      $("footerPhone").textContent = phoneRaw;

      ["waFloat", "heroWa", "footerWa"].forEach((id) => {
        if ($(id)) $(id).href = waHref;
      });
    }

    async function loadSupabaseData() {
      if (!sb) return;
      const safeQuery = (promiseLike) =>
        Promise.resolve(promiseLike)
          .then((res) => res.data || [])
          .catch(() => []);

      const now = new Date();
      const fromStr = todayIso();
      const toStr = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 6, 0))
        .toISOString()
        .slice(0, 10);

      const [vehRows, imgRows, locRows, evRows, settingsObj, availRows] = await Promise.all([
        safeQuery(
          sb
            .from("vehicles")
            .select("id,name,category,transmission,fuel,seats,daily_price_htva,sort")
            .order("sort")
        ),
        safeQuery(sb.from("vehicle_images").select("vehicle_id,path,sort").order("sort")),
        safeQuery(sb.from("locations").select("id,name").order("name")),
        safeQuery(sb.from("calendar_events").select("on_date,label_fr,label_ar,label_it,label_en")),
        Promise.resolve(sb.rpc("get_public_settings"))
          .then((res) => res.data || {})
          .catch(() => ({})),
        safeQuery(sb.rpc("public_availability", { from_d: fromStr, to_d: toStr }))
      ]);

      state.vehicles = vehRows;
      state.locations = locRows;
      state.availability = availRows;
      Object.assign(state.settings, settingsObj);

      state.imagesById = {};
      state.imagesByName = {};
      imgRows.forEach((row) => {
        if (!state.imagesById[row.vehicle_id]) {
          state.imagesById[row.vehicle_id] = row.path;
        }
        const matchedVeh = vehRows.find((v) => v.id === row.vehicle_id);
        if (matchedVeh && !state.imagesByName[matchedVeh.name]) {
          state.imagesByName[matchedVeh.name] = `${IMG_BUCKET_URL}${row.path}`;
        }
      });

      state.events = {};
      evRows.forEach((ev) => {
        state.events[ev.on_date] = ev;
      });

      if (locRows.length) {
        const locOpts = locRows
          .map((l) => `<option value="${esc(l.id)}">${esc(l.name)}</option>`)
          .join("");
        $("pickupLoc").innerHTML = locOpts;
        $("returnLoc").innerHTML = locOpts;
      } else {
        const fallbackOpts = DEFAULT_LOCS.map(
          (l) => `<option value="${esc(l[0])}">${esc(l[0])}</option>`
        ).join("");
        $("pickupLoc").innerHTML = fallbackOpts;
        $("returnLoc").innerHTML = fallbackOpts;
      }

      syncContactLinks();
      applyLanguage();

      try {
        const pendingRaw = sessionStorage.getItem("pend");
        if (pendingRaw) {
          const pending = JSON.parse(pendingRaw);
          const { data: { session } } = await sb.auth.getSession();
          if (pending && session && state.vehicles.some((v) => v.id === pending.v)) {
            sessionStorage.removeItem("pend");
            state.range = { s: pending.s, e: pending.e };
            if (pending.p) $("pickupLoc").value = pending.p;
            if (pending.r) $("returnLoc").value = pending.r;
            if (pending.f !== undefined) $("modelFilter").value = pending.f;
            renderRangeCalendar();
            renderSearchResults();
            openServerQuoteDialog(pending.v);
          }
        }
      } catch (e) {}
    }

    function initMotionEffects() {
      const bar = $("scrollBar");
      const updateProgress = () => {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const pct = maxScroll > 0 ? Math.min(100, Math.max(0, (window.scrollY / maxScroll) * 100)) : 0;
        if (bar) bar.style.width = `${pct}%`;
      };
      window.addEventListener("scroll", updateProgress, { passive: true });
      updateProgress();

      const revealEls = document.querySelectorAll(".reveal");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) {
        revealEls.forEach((el) => el.classList.add("is-visible"));
        return;
      }

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12, rootMargin: "0px 0px -30px 0px" }
      );

      revealEls.forEach((el) => observer.observe(el));
    }

    /* =========================================================================
       9. EVENT LISTENERS & BOOTSTRAP
       ========================================================================= */
    $("langSel").addEventListener("change", () => {
      lang = $("langSel").value;
      try {
        localStorage.setItem("lang", lang);
      } catch (e) {}
      applyLanguage();
    });

    $("prevMonth").addEventListener("click", () => {
      state.monthOffset = Math.max(0, state.monthOffset - 1);
      renderRangeCalendar();
    });

    $("nextMonth").addEventListener("click", () => {
      state.monthOffset = Math.min(5, state.monthOffset + 1);
      renderRangeCalendar();
    });

    $("modelFilter").addEventListener("change", () => {
      renderRangeCalendar();
      if (state.resultsShown && state.range.s && state.range.e) {
        renderSearchResults();
      }
    });

    $("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      setSearchMessage("");
      if (!state.range.s || !state.range.e) {
        return setSearchMessage(tr("pick"));
      }
      if (diffDays(state.range.s, state.range.e) < minRentalDays()) {
        return setSearchMessage(tr("min").replace("{n}", minRentalDays()));
      }
      renderSearchResults();
    });

    $("calModelSel").addEventListener("change", renderModelCalendar);
    $("calPrev").addEventListener("click", () => {
      state.calMonthOffset = Math.max(0, state.calMonthOffset - 1);
      renderModelCalendar();
    });
    $("calNext").addEventListener("click", () => {
      state.calMonthOffset = Math.min(4, state.calMonthOffset + 1);
      renderModelCalendar();
    });

    $("dlgClose").addEventListener("click", () => $("quoteDlg").close());

    $("dlgConfirm").addEventListener("click", async () => {
      if (!sb) return;
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        try {
          sessionStorage.setItem(
            "pend",
            JSON.stringify({
              v: state.selectedVehicleId,
              s: state.range.s,
              e: state.range.e,
              p: $("pickupLoc").value,
              r: $("returnLoc").value,
              f: $("modelFilter").value
            })
          );
        } catch (e) {}
        location.href = "compte.html?next=index";
        return;
      }

      $("dlgConfirm").disabled = true;
      const { data, error } = await sb.rpc("request_booking_v2", {
        p_vehicle: state.selectedVehicleId,
        p_start: state.range.s,
        p_end: state.range.e,
        p_pickup: $("pickupLoc").value,
        p_return: $("returnLoc").value
      });

      if (error || !data || !data.ok) {
        const errKey = `e_${data && data.error}`;
        $("dlgMsg").className = "msg-bad";
        $("dlgMsg").textContent = T[errKey] ? tr(errKey) : tr("e_other");
        $("dlgConfirm").disabled = false;
        return;
      }

      $("dlgMsg").className = "msg-good";
      $("dlgMsg").innerHTML = `${esc(tr("ok"))} <a href="pay.html?b=${esc(data.id)}">${esc(tr("py"))}</a>`;
    });

    $("reqClose").addEventListener("click", closeQuickModal);
    $("doneCloseBtn").addEventListener("click", closeQuickModal);
    $("reqModal").addEventListener("click", (e) => {
      if (e.target === $("reqModal")) closeQuickModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeQuickModal();
        if ($("quoteDlg").open) $("quoteDlg").close();
      }
    });

    $("reqStart").addEventListener("change", () => {
      if (!$("reqStart").value) return;
      const isoMin = addDaysIso($("reqStart").value, minRentalDays());
      $("reqEnd").min = isoMin;
      if ($("reqEnd").value < isoMin) $("reqEnd").value = isoMin;
      updateQuickQuote();
    });

    $("reqEnd").addEventListener("change", updateQuickQuote);

    $("reqForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const fullName = $("reqName").value.trim();
      const phoneVal = $("reqPhone").value.replace(/\s+/g, "");
      const startVal = $("reqStart").value;
      const endVal = $("reqEnd").value;
      const locVal = $("reqLoc").value;

      const phoneOk = /^(\+216)?[2459][0-9]{7}$/.test(phoneVal);
      const datesOk =
        Boolean(startVal && endVal) &&
        startVal >= todayIso() &&
        diffDays(startVal, endVal) >= minRentalDays();

      $("phoneErr").style.display = phoneOk ? "none" : "block";
      $("dateErr").style.display = datesOk ? "none" : "block";

      if (!phoneOk || !datesOk || !fullName) {
        if (!fullName) $("reqName").focus();
        return;
      }

      const submitBtn = $("reqSubmitBtn");
      submitBtn.disabled = true;
      $("reqSubmitErr").style.display = "none";

      const cleanVehicle = state.modalCar.replace(" (VIP)", "");
      let rpcResult;
      try {
        if (!sb) throw new Error("no_sb");
        const { data, error } = await sb.rpc("request_booking", {
          p_vehicle_name: cleanVehicle,
          p_start: startVal,
          p_end: endVal,
          p_name: fullName,
          p_phone: phoneVal,
          p_location: locVal
        });
        rpcResult = error ? { ok: false, error: "other" } : data;
      } catch (e) {
        rpcResult = { ok: false, error: "other" };
      }

      submitBtn.disabled = false;

      const waDigits = (state.settings.whatsapp || WA_DEFAULT).replace(/\D/g, "");
      if (!rpcResult || (!rpcResult.ok && rpcResult.error === "other")) {
        const fallbackMsg =
          `Bonjour, demande de réservation - AMINE RENT A CAR\n` +
          `Véhicule : ${state.modalCar}\n` +
          `Nom : ${fullName}\n` +
          `Tél : ${phoneVal}\n` +
          `Du : ${startVal}  Au : ${endVal}\n` +
          `Prise en charge : ${locVal}`;
        rpcResult = { ok: true, id: "00000000", days: diffDays(startVal, endVal), fallback: fallbackMsg };
      }

      if (!rpcResult.ok) {
        const errMap = {
          unavailable: "e_unavailable",
          too_many: "e_too_many",
          dates: "dateErr",
          location: "e_location",
          phone: "phoneErr"
        };
        const mappedKey = errMap[rpcResult.error] || "e_other";
        $("reqSubmitErr").textContent = tr(mappedKey);
        $("reqSubmitErr").style.display = "block";
        return;
      }

      const summaryText =
        rpcResult.fallback ||
        `Bonjour, demande de réservation - AMINE RENT A CAR\n` +
          `Réf : ${String(rpcResult.id || "").slice(0, 8)}\n` +
          `Véhicule : ${state.modalCar}\n` +
          `Nom : ${fullName}\n` +
          `Tél : ${phoneVal}\n` +
          `Du : ${startVal}  Au : ${endVal} (${rpcResult.days} ${tr("days")})\n` +
          `Prise en charge : ${locVal}`;

      $("waActionLink").href = `https://wa.me/${waDigits}?text=${encodeURIComponent(summaryText)}`;
      $("payActionLink").hidden = Boolean(rpcResult.fallback);
      if (!rpcResult.fallback && rpcResult.id) {
        $("payActionLink").href = `pay.html?b=${encodeURIComponent(rpcResult.id)}`;
      }

      $("reqForm").hidden = true;
      $("reqSuccessBox").hidden = false;
    });

    syncContactLinks();
    applyLanguage();
    initMotionEffects();
    loadSupabaseData();
  </script>
</body>
</html>
