<style>
:root{
  --ink:#14181D;--ink-2:#212730;--paper:#F1F2F0;--surface:#FFFFFF;
  --red:#D62828;--red-dark:#A61C1C;--green:#1F9D57;--green-dark:#157A42;
  --gold:#C9A227;--line:#D9DAD6;--muted:#5D6268;--text:#1F2226;
  --radius:14px;--shadow:0 8px 24px rgba(20,24,29,0.06);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Work Sans","Cairo",system-ui,sans-serif;background:var(--paper);color:var(--text)}
h1,h2,h3{font-family:"Barlow Condensed","Cairo",sans-serif;font-weight:800;line-height:1.15}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:35;background:linear-gradient(90deg,var(--ink),var(--ink-2));color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid var(--red)}
header a.brand{color:#fff;text-decoration:none;font-family:"Barlow Condensed","Cairo",sans-serif;font-size:22px;font-weight:800;letter-spacing:.02em}
main{max-width:820px;margin:0 auto;padding:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
input,select,textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}

button,.btn{border:0;border-radius:9px;padding:9px 14px;font:700 13.5px inherit;color:#fff;background:var(--red);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .15s ease,opacity .15s ease}
button:hover:not(:disabled),.btn:hover{transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:not-allowed}
.dark{background:var(--ink)}.g{background:var(--green)}.g:hover{background:var(--green-dark)}.gold{background:var(--gold);color:#14171A}.r{background:var(--red)}.r:hover{background:var(--red-dark)}.wa{background:#128C7E}.sm{padding:6px 12px;font-size:13px}

.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:var(--surface);color:var(--ink);border:1px solid var(--line)}.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.phone-box{display:grid;grid-template-columns:auto 150px 1fr;gap:8px;align-items:center}
.flag-badge{height:42px;min-width:48px;border-radius:9px;border:1.5px solid var(--line);background:#F8F9F7;display:flex;align-items:center;justify-content:center;font-size:22px}

.welcome-box{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.profile-head{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed","Cairo",sans-serif;font-size:26px;font-weight:800;flex-shrink:0}

.trust-banner{background:#F4F8F5;border:1px solid #C8E2D2;border-inline-start:4px solid var(--green);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:13.5px;color:#1A3526}
.trust-banner strong{display:block;margin-bottom:3px;color:var(--green-dark)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FAFBF9}
.doc-card label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}

p.f{margin:10px 0 0}.soft{color:var(--muted);font-size:13px}.msg{color:var(--red);font-weight:700;margin-top:8px}.ok{color:var(--green-dark);font-weight:700;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;background:#7C8288}
.st.pending{background:var(--gold);color:#14171A}.st.confirmed{background:var(--green)}.st.cancellation_requested{background:#E67E22}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a.lk{color:var(--red);font-weight:700}

.rib-box{background:#F8F9F7;border:1px dashed #BFC3BC;border-radius:10px;padding:12px;margin-top:10px}
.rib-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #E5E7E2;flex-wrap:wrap}
.rib-item:first-child{border-top:0;padding-top:0}
.rib-code{font-family:monospace;font-size:13.5px;font-weight:700;background:#fff;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.proof-box{margin-top:10px;padding-top:10px;border-top:1px solid #EAECE8}

.wa-float{position:fixed;bottom:18px;inset-inline-end:18px;z-index:45;background:#128C7E;color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13.5px;text-decoration:none;box-shadow:0 10px 24px rgba(18,140,126,.32);display:inline-flex;align-items:center;gap:8px}

/* Modal Bon + QR */
.modal-bg{position:fixed;inset:0;background:rgba(15,18,22,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.bon-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.bon-grid{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.bon-meta{display:grid;gap:6px;font-size:14px}
.qr-wrap{text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:#FAFAFA}
.qr-wrap canvas{display:block;margin:0 auto}
.bon-note{margin-top:14px;background:#F4F6F4;border-inline-start:4px solid var(--green);padding:10px 12px;border-radius:6px;font-size:13px}

@media(max-width:640px){
  .grid-2,.bon-grid{grid-template-columns:1fr}
  .phone-box{grid-template-columns:auto 130px 1fr}
}
@media print{
  header,.wa-float,.modal-bg .no-print{display:none!important}
  .modal-bg{position:static;background:none;padding:0}
  .modal-card{box-shadow:none;max-width:100%;padding:0}
}
</style>
