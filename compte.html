<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>حسابي | Amine Rent A Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
/* ============================================================================
   1. DESIGN TOKENS & THEME VARIABLES
   ============================================================================ */
:root {
  --ink: #12161B;
  --ink-2: #1E252E;
  --ink-3: #2C3542;
  --paper: #EEF0EC;
  --surface: #FFFFFF;
  --surface-2: #F8F9F7;
  --surface-3: #F2F4F0;

  --red: #D62828;
  --red-dark: #A61B1B;
  --red-soft: rgba(214, 40, 40, 0.10);

  --green: #1B9952;
  --green-dark: #13743D;
  --green-soft: rgba(27, 153, 82, 0.11);

  --gold: #C9A227;
  --gold-dark: #9B7A14;
  --gold-soft: rgba(201, 162, 39, 0.14);

  --wa: #128C7E;
  --wa-dark: #0B6B60;

  --line: #D7D9D3;
  --line-strong: #BFC4BA;
  --text: #1B1F24;
  --muted: #5A6068;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;

  --shadow-sm: 0 4px 14px rgba(18, 22, 27, 0.05);
  --shadow-md: 0 10px 28px rgba(18, 22, 27, 0.08);
  --shadow-lg: 0 22px 54px rgba(18, 22, 27, 0.18);

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --font-display: "Barlow Condensed", "Cairo", sans-serif;
  --font-body: "Cairo", "Work Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}

/* ============================================================================
   2. RESET & BASE STYLES
   ============================================================================ */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.58;
  background: var(--paper);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* خلفية حركية ناعمة تعطي عمقاً دون إزعاج */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 12% 14%, rgba(214, 40, 40, 0.06), transparent 42%),
    radial-gradient(circle at 88% 18%, rgba(201, 162, 39, 0.08), transparent 45%),
    radial-gradient(circle at 50% 92%, rgba(27, 153, 82, 0.06), transparent 48%);
  animation: ambientDrift 18s ease-in-out infinite alternate;
}

@keyframes ambientDrift {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(-1.5%, 1.2%, 0) scale(1.02); }
  100% { transform: translate3d(1.5%, -1%, 0) scale(1.01); }
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 800;
  line-height: 1.15;
  color: var(--ink);
}

a {
  color: inherit;
}

/* ============================================================================
   3. TOP NAVIGATION HEADER
   ============================================================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: linear-gradient(95deg, var(--ink) 0%, var(--ink-2) 65%, #27191C 100%);
  color: #FFFFFF;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 3px solid var(--red);
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-link {
  text-decoration: none;
  color: #FFFFFF;
  font-family: var(--font-display);
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 0.03em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.brand-badge {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(201, 162, 39, 0.18);
  color: #F6DC7E;
  border: 1px solid rgba(201, 162, 39, 0.35);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ============================================================================
   4. LAYOUT & CARDS
   ============================================================================ */
.page-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 22px 16px 88px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out), border-color 0.25s ease;
  animation: cardEnter 0.42s var(--ease-out) both;
}

.card:hover {
  border-color: var(--line-strong);
  box-shadow: var(--shadow-md);
}

@keyframes cardEnter {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.section-title {
  font-size: 25px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-sub {
  color: var(--muted);
  font-size: 13.5px;
  margin-top: 2px;
}

/* ============================================================================
   5. FORM CONTROLS, INTERNATIONAL PHONE & FLAGS
   ============================================================================ */
.field-group {
  margin-top: 12px;
}

.field-label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
  margin-bottom: 5px;
}

input,
select,
textarea {
  width: 100%;
  padding: 10px 13px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 14.5px;
  color: var(--text);
  background: #FFFFFF;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.22);
}

.phone-picker {
  display: grid;
  grid-template-columns: 54px 176px 1fr;
  gap: 8px;
  align-items: center;
}

.flag-box {
  height: 44px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--line);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  user-select: none;
  transition: transform 0.28s var(--ease-spring), border-color 0.2s ease;
}

.flag-box.pop {
  transform: scale(1.14) rotate(-3deg);
  border-color: var(--gold);
}

.phone-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 5px;
  font-size: 12.5px;
  color: var(--muted);
}

.mono-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--surface-3);
  border: 1px solid var(--line);
  padding: 2px 8px;
  border-radius: 6px;
  color: var(--ink-2);
}

/* ============================================================================
   6. BUTTONS & TABS
   ============================================================================ */
button,
.btn {
  border: 0;
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-family: var(--font-body);
  font-size: 13.5px;
  font-weight: 700;
  color: #FFFFFF;
  background: var(--red);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  text-decoration: none;
  transition: transform 0.18s var(--ease-spring), background-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

button:hover:not(:disabled),
.btn:hover {
  transform: translateY(-1.5px);
  box-shadow: 0 6px 16px rgba(18, 22, 27, 0.14);
}

button:active:not(:disabled),
.btn:active {
  transform: translateY(0) scale(0.98);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-dark { background: var(--ink); }
.btn-dark:hover:not(:disabled) { background: var(--ink-2); }

.btn-green { background: var(--green); }
.btn-green:hover:not(:disabled) { background: var(--green-dark); }

.btn-gold { background: var(--gold); color: var(--ink); }
.btn-red { background: var(--red); }
.btn-red:hover:not(:disabled) { background: var(--red-dark); }

.btn-wa { background: var(--wa); }
.btn-wa:hover:not(:disabled) { background: var(--wa-dark); }

.btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 7px; }
.btn-full { width: 100%; padding: 11px 16px; font-size: 14.5px; }

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.auth-tabs button {
  background: var(--surface);
  color: var(--ink);
  border: 1.5px solid var(--line);
  padding: 11px 14px;
}

.auth-tabs button.active {
  background: var(--ink);
  color: #FFFFFF;
  border-color: var(--ink);
}

.filter-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-pills button {
  background: var(--surface-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
  padding: 6px 12px;
  font-size: 12.5px;
}

.filter-pills button.active {
  background: var(--ink);
  color: #FFFFFF;
  border-color: var(--ink);
}

/* ============================================================================
   7. WELCOME BANNER, AVATAR & TRUST / CONFIDENTIALITY CARD
   ============================================================================ */
.welcome-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.user-identity {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar-frame {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 2.5px solid var(--gold);
  background: linear-gradient(135deg, var(--ink), var(--ink-3));
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 6px 18px rgba(18, 22, 27, 0.16);
}

.avatar-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.vip-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--green-dark);
  background: var(--green-soft);
  padding: 2px 10px;
  border-radius: 999px;
}

.trust-panel {
  margin-top: 14px;
  background: linear-gradient(135deg, #F3F8F5 0%, #FBF9F0 100%);
  border: 1px solid #C7DFD0;
  border-inline-start: 4px solid var(--green);
  border-radius: var(--radius-md);
  padding: 13px 15px;
}

.trust-title {
  font-weight: 800;
  font-size: 14px;
  color: var(--green-dark);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.trust-copy {
  font-size: 13px;
  color: #25332B;
  line-height: 1.55;
}

.trust-meta-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.trust-pill {
  font-size: 11.5px;
  font-weight: 700;
  background: #FFFFFF;
  border: 1px solid #D2E4D9;
  color: var(--ink-2);
  padding: 3px 9px;
  border-radius: 999px;
}

/* ============================================================================
   8. BOOKING CARDS, TIMELINE STEPPER, RIB & PROOF UPLOAD
   ============================================================================ */
.booking-item {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 15px;
  margin-bottom: 12px;
  background: var(--surface-2);
  transition: transform 0.2s var(--ease-out), border-color 0.2s ease, background-color 0.2s ease;
}

.booking-item:hover {
  border-color: var(--line-strong);
  background: #FFFFFF;
}

.booking-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.car-name {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
}

.status-badge {
  font-size: 12px;
  font-weight: 800;
  padding: 4px 11px;
  border-radius: 999px;
  color: #FFFFFF;
  background: #6F767E;
}

.status-badge.pending {
  background: var(--gold);
  color: var(--ink);
}

.status-badge.confirmed {
  background: var(--green);
}

.status-badge.cancellation_requested {
  background: #E67E22;
}

.status-badge.cancelled,
.status-badge.expired {
  background: #7C8288;
}

/* مؤشر مراحل الحجز المرئي */
.flow-steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 12px 0;
}

.flow-step {
  background: #ECEEE9;
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  text-align: center;
  border: 1px solid transparent;
  transition: all 0.2s ease;
}

.flow-step.done {
  background: var(--green-soft);
  color: var(--green-dark);
  border-color: rgba(27, 153, 82, 0.28);
}

.flow-step.current {
  background: var(--gold-soft);
  color: var(--ink);
  border-color: var(--gold);
}

.rib-panel {
  background: #FFFFFF;
  border: 1.5px dashed #BFC4BA;
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-top: 10px;
}

.rib-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid #ECEEE9;
  flex-wrap: wrap;
}

.rib-row:first-of-type {
  border-top: 0;
}

.rib-val {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--red-dark);
  background: var(--surface-3);
  padding: 4px 9px;
  border-radius: 6px;
  border: 1px solid var(--line);
  margin-top: 4px;
  display: inline-block;
  direction: ltr;
}

.proof-panel {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.proof-controls {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.action-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 13px;
}

/* ============================================================================
   9. DOCUMENTS GRID & FEEDBACK MESSAGES
   ============================================================================ */
.form-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.doc-box {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 13px;
}

.doc-box-title {
  font-weight: 800;
  font-size: 13.5px;
  color: var(--ink);
  margin-bottom: 8px;
}

.msg-err {
  color: var(--red);
  font-weight: 700;
  font-size: 13px;
  margin-top: 8px;
}

.msg-ok {
  color: var(--green-dark);
  font-weight: 700;
  font-size: 13px;
  margin-top: 8px;
}

.link-inline {
  color: var(--red);
  font-weight: 700;
  text-decoration: none;
  font-size: 13px;
}

.link-inline:hover {
  text-decoration: underline;
}

/* ============================================================================
   10. FLOATING WHATSAPP HELP BUTTON & TOAST
   ============================================================================ */
.wa-fab {
  position: fixed;
  bottom: 18px;
  inset-inline-start: 18px;
  z-index: 45;
  background: var(--wa);
  color: #FFFFFF;
  border-radius: 999px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 13px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 12px 26px rgba(18, 140, 126, 0.34);
  transition: transform 0.22s var(--ease-spring), background-color 0.2s ease;
}

.wa-fab:hover {
  transform: translateY(-2px) scale(1.02);
  background: var(--wa-dark);
}

.toast-box {
  position: fixed;
  bottom: 18px;
  inset-inline-end: 18px;
  z-index: 80;
  background: var(--ink);
  color: #FFFFFF;
  border-inline-start: 4px solid var(--green);
  border-radius: var(--radius-md);
  padding: 11px 16px;
  font-size: 13.5px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.28s var(--ease-out);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================================
   11. MODAL (BON DE RÉSERVATION + QR CODE)
   ============================================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(12, 15, 19, 0.68);
  backdrop-filter: blur(3px);
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-sheet {
  background: #FFFFFF;
  border-radius: var(--radius-xl);
  max-width: 580px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  padding: 22px;
  box-shadow: var(--shadow-lg);
  animation: modalPop 0.26s var(--ease-spring);
}

@keyframes modalPop {
  from { opacity: 0; transform: scale(0.95) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.bon-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 12px;
  margin-bottom: 16px;
}

.bon-body {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: center;
}

.bon-rows {
  display: grid;
  gap: 7px;
  font-size: 14px;
}

.qr-card {
  text-align: center;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px;
  background: var(--surface-2);
}

.qr-card canvas {
  display: block;
  margin: 0 auto;
}

.bon-footer-note {
  margin-top: 14px;
  background: #F3F8F5;
  border-inline-start: 4px solid var(--green);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  color: #1D3427;
}

/* ============================================================================
   12. RESPONSIVE & PRINT STYLES
   ============================================================================ */
@media (max-width: 680px) {
  .form-grid-2,
  .bon-body {
    grid-template-columns: 1fr;
  }
  .flow-steps {
    grid-template-columns: 1fr 1fr;
  }
  .phone-picker {
    grid-template-columns: 48px 146px 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media print {
  .site-header,
  .wa-fab,
  .toast-box,
  .no-print {
    display: none !important;
  }
  .modal-backdrop {
    position: static;
    background: none;
    backdrop-filter: none;
    padding: 0;
  }
  .modal-sheet {
    box-shadow: none;
    max-width: 100%;
    padding: 0;
  }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="brand-wrap">
    <a class="brand-link" href="index.html">AMINE RENT A CAR</a>
    <span class="brand-badge" id="hdrBadge">CLIENT</span>
  </div>
  <div class="header-actions">
    <button type="button" class="btn-dark btn-sm" id="langBtn">Français</button>
    <button type="button" class="btn-dark btn-sm" id="logoutBtn" hidden></button>
  </div>
</header>

<main class="page-wrap">

  <!-- ========================================================================
       A. AUTHENTICATION CARD (LOGIN / REGISTER)
       ======================================================================== -->
  <section id="authSection">
    <div class="auth-tabs">
      <button type="button" class="active" id="tabLogin"></button>
      <button type="button" id="tabRegister"></button>
    </div>

    <div class="card">
      <h2 id="authHeading" style="font-size:28px"></h2>
      <p class="section-sub" id="authSubtext"></p>

const t = key => (I18N[LANG] && I18N[LANG][key]) || I18N.fr[key] || key;

function showToast(msg) {
  const box = $("toastBox");
  if (!box) return;
  box.textContent = msg;
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, 2500);
}

function cleanPhoneDigits(val) {
  return String(val || "").replace(/[^\d]/g, "").replace(/^0+/, "");
}

function getSelectedCountry() {
  const code = $("countryCodeSel").value || "+216";
  return COUNTRIES.find(c => c.code === code) || COUNTRIES[0];
}

function syncCountrySelectOptions() {
  const sel = $("countryCodeSel");
  const prevCode = sel.value || "+216";
  sel.innerHTML = COUNTRIES.map(c =>
    `<option value="${esc(c.code)}">${esc(LANG === "ar" ? c.ar : c.fr)}</option>`
  ).join("");
  sel.value = COUNTRIES.some(c => c.code === prevCode) ? prevCode : "+216";
  refreshFlagAndPreview(false);
}

function refreshFlagAndPreview(animate = true) {
  const c = getSelectedCountry();
  const flagEl = $("countryFlag");
  flagEl.textContent = c.flag;
  if (animate) {
    flagEl.classList.remove("pop");
    void flagEl.offsetWidth;
    flagEl.classList.add("pop");
  }
  const digits = cleanPhoneDigits($("phoneNumInp").value);
  $("phoneE164Preview").textContent = digits ? `${c.code}${digits}` : c.code;
}

function autoDetectCountryPrefix() {
  const raw = $("phoneNumInp").value.trim();
  const match = raw.match(/^\+?(\d{1,3})[\s-]+(.*)$/);
  if (match) {
    const code = "+" + match[1];
    if (COUNTRIES.some(x => x.code === code)) {
      $("countryCodeSel").value = code;
      $("phoneNumInp").value = match[2];
    }
  }
  refreshFlagAndPreview(true);
}

/* ============================================================================
   6. AUTHENTICATION & PASSWORD RECOVERY
   ============================================================================ */
function resolveAuthIdentifier() {
  const emailVal = $("emailInp").value.trim().toLowerCase();
  if (emailVal) {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) return null;
    return { email: emailVal, isEmail: true };
  }
  const c = getSelectedCountry();
  const digits = cleanPhoneDigits($("phoneNumInp").value);
  if (!digits || digits.length < 6) return null;
  const codeNum = c.code.replace(/[^\d]/g, "");
  return { email: `u_${codeNum}${digits}@tel.amine-rent-car.tn`, isEmail: false };
}

$("authSubmitBtn").onclick = async () => {
  $("authErr").textContent = "";
  $("authOk").textContent = "";

  const pw = $("passwordInp").value;
  if (pw.length < 8) {
    $("authErr").textContent = t("errShortPass");
    return;
  }

  const ident = resolveAuthIdentifier();
  const c = getSelectedCountry();
  const digits = cleanPhoneDigits($("phoneNumInp").value);
  const fullPhone = digits.length >= 6 ? `${c.code}${digits}` : "";

  if (!ident && !fullPhone) {
    $("authErr").textContent = t("errBadPhone");
    return;
  }

  $("authSubmitBtn").disabled = true;
  try {
    if (AUTH_MODE === "register") {
      const fullName = $("fullNameInp").value.trim();
      if (fullName.length < 2) {
        $("authErr").textContent = t("errNeedName");
        return;
      }
      const targetEmail = ident ? ident.email : `u_${c.code.replace(/[^\d]/g, "")}${digits}@tel.amine-rent-car.tn`;
      const { data, error } = await sb.auth.signUp({
        email: targetEmail,
        password: pw,
        options: {
          data: {
            full_name: fullName,
            phone: fullPhone
          }
        }
      });
      if (error) {
        $("authErr").textContent = error.message;
        return;
      }
      if (!data.session) {
        $("authOk").textContent = t("okCreated");
        return;
      }
    } else {
      if (!ident) {
        $("authErr").textContent = t("errBadPhone");
        return;
      }
      const { error } = await sb.auth.signInWithPassword({
        email: ident.email,
        password: pw
      });
      if (error) {
        $("authErr").textContent = t("errBadCreds");
        return;
      }
    }
    $("passwordInp").value = "";
    await bootstrapClientApp();
  } catch (err) {
    $("authErr").textContent = err.message || t("errBadCreds");
  } finally {
    $("authSubmitBtn").disabled = false;
  }
};

$("forgotLink").onclick = async e => {
  e.preventDefault();
  $("authErr").textContent = "";
  $("authOk").textContent = "";
  const em = $("emailInp").value.trim().toLowerCase();
  if (!em) {
    const digits = cleanPhoneDigits($("phoneNumInp").value);
    if (digits.length >= 6) {
      $("authOk").textContent = t("msgResetPhone");
    } else {
      $("authErr").textContent = t("errNeedEmailReset");
    }
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) {
    $("authErr").textContent = t("errNeedEmailReset");
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(em, {
    redirectTo: location.origin + location.pathname
  });
  if (error) $("authErr").textContent = error.message;
  else $("authOk").textContent = t("okResetMail");
};

/* ============================================================================
   7. BOOTSTRAP & DATA LOADING
   ============================================================================ */
async function bootstrapClientApp() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session || !session.user) {
    $("authSection").hidden = false;
    $("clientApp").hidden = true;
    $("logoutBtn").hidden = true;
    return;
  }

  CURRENT_USER = session.user;

  const { data: profRow } = await sb
    .from("profiles")
    .select("*")
    .eq("id", CURRENT_USER.id)
    .maybeSingle();

  if (profRow && ["admin", "staff"].includes(profRow.role)) {
    location.href = "admin.html";
    return;
  }

  PROFILE = profRow || {
    id: CURRENT_USER.id,
    full_name: CURRENT_USER.user_metadata?.full_name || "",
    phone: CURRENT_USER.user_metadata?.phone || "",
    billing_address: "",
    tax_id: "",
    id_doc_type: "cin",
    id_doc_number: "",
    id_doc_path: "",
    license_path: "",
    flight_ticket: "",
    avatar_path: ""
  };

  $("authSection").hidden = true;
  $("recoverySection").hidden = true;
  $("clientApp").hidden = false;
  $("logoutBtn").hidden = false;

  $("profName").value = PROFILE.full_name || "";
  $("profPhone").value = PROFILE.phone || "";
  $("profAddr").value = PROFILE.billing_address || "";
  $("profTax").value = PROFILE.tax_id || "";
  $("idDocTypeSel").value = PROFILE.id_doc_type || "cin";
  $("idDocNumInp").value = PROFILE.id_doc_number || "";
  $("flightInp").value = PROFILE.flight_ticket || "";

  await refreshDashboardData();
}

async function refreshDashboardData() {
  await renderIdentityHeader();
  await renderStoredDocumentLinks();

  const [bkRes, bankRes] = await Promise.all([
    sb.from("bookings")
      .select("*,vehicles(name),payments(id,status,amount,proof_path,created_at),invoices(id,number,kind)")
      .order("created_at", { ascending: false }),
    sb.from("bank_accounts")
      .select("*")
      .order("sort")
  ]);

  if (bkRes.error) {
    $("bookingsContainer").innerHTML = `<div class="msg-err">${esc(bkRes.error.message)}</div>`;
    return;
  }

  BOOKINGS = Array.isArray(bkRes.data) ? bkRes.data : [];
  BANKS = Array.isArray(bankRes.data) ? bankRes.data : [];
  renderBookingsList();
}

async function renderIdentityHeader() {
  const displayName = (PROFILE?.full_name || "").trim();
  $("welcomeTitle").textContent = `${t("welcomePrefix")}${displayName ? " " + displayName : ""}`;

  const circle = $("avatarCircle");
  const initials = (displayName || "C")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map(w => w[0])
    .join("")
    .toUpperCase();

  if (PROFILE?.avatar_path) {
    const { data } = await sb.storage.from(DOCS_BUCKET).createSignedUrl(PROFILE.avatar_path, 3600);
    if (data && data.signedUrl) {
      circle.innerHTML = `<img src="${esc(data.signedUrl)}" alt="${esc(displayName || "Avatar")}">`;
      return;
    }
  }
  circle.textContent = initials || "C";
}

$("avatarFileInp").onchange = async () => {
  const file = $("avatarFileInp").files[0];
  if (!file || !PROFILE) return;
  const extMap = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };
  const ext = extMap[file.type];
  if (!ext || file.size > 3 * 1024 * 1024) {
    showToast(t("errAvatarType"));
    return;
  }
  const path = `avatars/${PROFILE.id}_${Date.now()}.${ext}`;
  const up = await sb.storage.from(DOCS_BUCKET).upload(path, file, { contentType: file.type });
  if (up.error) {
    showToast(up.error.message);
    return;
  }
  const { error } = await sb.from("profiles").update({ avatar_path: path }).eq("id", PROFILE.id);
  if (!error) {
    PROFILE.avatar_path = path;
    await renderIdentityHeader();
    showToast(t("toastSaved"));
  }
};

async function renderStoredDocumentLinks() {
  const fillLink = async (path, targetId) => {
    const el = $(targetId);
    if (!el) return;
    if (!path) {
      el.innerHTML = "";
      return;
    }
    const { data } = await sb.storage.from(DOCS_BUCKET).createSignedUrl(path, 300);
    if (data && data.signedUrl) {
      el.innerHTML = `<a class="link-inline" href="${esc(data.signedUrl)}" target="_blank" rel="noopener">📎 ${t("viewDocLink")}</a>`;
    }
  };
  await Promise.all([
    fillLink(PROFILE?.id_doc_path, "idDocPreview"),
    fillLink(PROFILE?.license_path, "licPreview")
  ]);
}

function isHistoricalBooking(b) {
  if (["completed", "cancelled", "expired"].includes(b.status)) return true;
  const endMs = b.end_at ? new Date(b.end_at).getTime() : 0;
  return endMs > 0 && endMs < Date.now() && b.status !== "pending";
}

function buildFlowStepsHtml(b, hasProof, isVerified) {
  const isConfirmed = b.status === "confirmed" || isVerified;
  const s1 = "done";
  const s2 = isConfirmed || hasProof ? "done" : b.status === "pending" ? "current" : "done";
  const s3 = isVerified ? "done" : hasProof ? "current" : "";
  const s4 = isConfirmed ? "done" : "";

  return `
    <div class="flow-steps" aria-hidden="true">
      <div class="flow-step ${s1}">${t("step1")}</div>
      <div class="flow-step ${s2}">${t("step2")}</div>
      <div class="flow-step ${s3}">${t("step3")}</div>
      <div class="flow-step ${s4}">${t("step4")}</div>
    </div>
  `;
}

function renderBookingsList() {
  const fmtDate = d => new Date(d).toLocaleDateString(LANG === "ar" ? "ar-TN" : "fr-FR", {
    timeZone: "Africa/Tunis"
  });

  const filtered = BOOKINGS.filter(b => {
    if (FILTER_MODE === "active") return !isHistoricalBooking(b);
    if (FILTER_MODE === "history") return isHistoricalBooking(b);
    return true;
  });

  if (!filtered.length) {
    $("bookingsContainer").innerHTML = `<p class="section-sub" style="padding:8px 0">${t("emptyBookings")}</p>`;
    return;
  }

  const banksBlock = BANKS.length
    ? `
      <div class="rib-panel">
        <div style="font-weight:800;font-size:13.5px;margin-bottom:4px">${t("ribTitle")}</div>
        ${BANKS.map(acc => `
          <div class="rib-row">
            <div>
              <b>${esc(acc.bank)}</b> · <span class="section-sub">${esc(acc.holder)}</span><br>
              <span class="rib-val">${esc(acc.rib)}</span>
            </div>
            <button type="button" class="btn-dark btn-sm" data-copy-rib="${esc(acc.rib)}">${t("copyRib")}</button>
          </div>
        `).join("")}
      </div>
    `
    : `<div class="rib-panel section-sub">${t("ribEmpty")}</div>`;

  $("bookingsContainer").innerHTML = filtered.map(b => {
    const payments = [...(b.payments || [])].sort((a, z) => new Date(z.created_at) - new Date(a.created_at));
    const latestProof = payments.find(p => p.proof_path);
    const isCancelledOrExpired = ["cancelled", "expired"].includes(b.status);
    const isVerified = !isCancelledOrExpired && payments.some(p => p.status === "verified");
    const isProofPending = !isCancelledOrExpired && !isVerified && payments.some(p => p.status === "proof_uploaded");
    const historical = isHistoricalBooking(b);

    const statusText = (historical && b.status === "confirmed")
      ? t("statusMap").completed
      : (t("statusMap")[b.status] || b.status);

    const canUploadProof = !historical && ["pending", "confirmed"].includes(b.status) && !isVerified;
    const canShowBonQr = b.status === "confirmed" || isVerified;

    return `
      <article class="booking-item">
        <div class="booking-top">
          <div class="car-name">${esc(b.vehicles?.name || "")}</div>
          <span class="status-badge ${esc(b.status)}">${esc(statusText)}</span>
        </div>

        <div class="section-sub" style="margin-top:4px">
          ${t("from")} <b>${fmtDate(b.start_at)}</b> ${t("to")} <b>${fmtDate(b.end_at)}</b>
          · ${esc(b.quote?.days ?? "")} ${t("days")}
          ${b.pickup_text ? ` · ${esc(b.pickup_text)}` : ""}
        </div>

        ${buildFlowStepsHtml(b, Boolean(latestProof), isVerified)}

        ${isVerified ? `<div class="msg-ok">✓ ${t("paidBanner")}</div>` : ""}
        ${isProofPending ? `<div class="section-sub" style="font-weight:700;margin-top:6px">⏳ ${t("proofBanner")}</div>` : ""}

        ${!historical && ["pending", "confirmed"].includes(b.status) ? `
          ${banksBlock}
          ${canUploadProof ? `
            <div class="proof-panel" data-proof-for="${esc(b.id)}">
              <div style="font-weight:800;font-size:13px">${t("proofLabel")}</div>
              <div class="proof-controls">
                <input type="file" class="pf-file" accept="image/jpeg,image/png,image/webp,application/pdf" style="max-width:290px;padding:6px">
                <input type="number" step="0.5" min="0" class="pf-amt" placeholder="${t("proofHint")}" style="max-width:210px">
                <button type="button" class="btn-green btn-sm pf-submit">${t("sendProof")}</button>
              </div>
              <div class="msg-err pf-err"></div>
              <div class="msg-ok pf-ok"></div>
            </div>
          ` : ""}
        ` : ""}

        <div class="action-bar">
          ${canShowBonQr ? `<button type="button" class="btn-green btn-sm" data-open-bon="${esc(b.id)}">🎫 ${t("bonBtn")}</button>` : ""}
          ${latestProof ? `<button type="button" class="btn-dark btn-sm" data-view-proof="${esc(latestProof.proof_path)}">📎 ${t("viewProof")}</button>` : ""}
          ${(b.invoices || []).map(inv => `
            <a class="btn btn-dark btn-sm" target="_blank" rel="noopener" href="invoice.html?id=${esc(inv.id)}">
              ${inv.kind === "credit_note" ? t("cnPrefix") : t("invPrefix")} ${esc(inv.number)}
            </a>
          `).join("")}
          ${!historical && ["pending", "confirmed"].includes(b.status) ? `
            <button type="button" class="btn-red btn-sm" data-cancel-bk="${esc(b.id)}">${t("cancelBtn")}</button>
          ` : ""}
        </div>
      </article>
    `;
  }).join("");

  // Copy RIB buttons
  $("bookingsContainer").querySelectorAll("[data-copy-rib]").forEach(btn => {
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(btn.dataset.copyRib); } catch (_) {}
      const orig = btn.textContent;
      btn.textContent = t("copiedRib");
      showToast(t("toastCopied"));
      setTimeout(() => { btn.textContent = orig; }, 1400);
    };
  });

  // Upload payment proof per booking
  $("bookingsContainer").querySelectorAll("[data-proof-for]").forEach(box => {
    const bookingId = box.dataset.proofFor;
    const fileInput = box.querySelector(".pf-file");
    const amtInput = box.querySelector(".pf-amt");
    const errOut = box.querySelector(".pf-err");
    const okOut = box.querySelector(".pf-ok");
    const submitBtn = box.querySelector(".pf-submit");

    submitBtn.onclick = async () => {
      errOut.textContent = "";
      okOut.textContent = "";
      const file = fileInput.files[0];
      const extMap = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "application/pdf": "pdf" };
      const ext = file ? extMap[file.type] : null;
      if (!file || !ext || file.size > 5 * 1024 * 1024) {
        errOut.textContent = t("errFileType");
        return;
      }

      submitBtn.disabled = true;
      const oldLabel = submitBtn.textContent;
      submitBtn.textContent = t("sendingProof");

      const storagePath = `${PROFILE.id}/${bookingId}_${Date.now()}.${ext}`;
      const up = await sb.storage.from(PROOFS_BUCKET).upload(storagePath, file, {
        contentType: file.type,
        upsert: false
      });

      if (up.error) {
        errOut.textContent = `${t("proofErrGeneric")} (${up.error.message})`;
        submitBtn.disabled = false;
        submitBtn.textContent = oldLabel;
        return;
      }

      const amountNum = amtInput.value !== "" ? +amtInput.value : 0;
      const { error: payErr } = await sb.from("payments").insert({
        booking_id: bookingId,
        user_id: PROFILE.id,
        amount: amountNum,
        proof_path: storagePath,
        status: "proof_uploaded"
      });

      submitBtn.disabled = false;
      submitBtn.textContent = oldLabel;

      if (payErr) {
        errOut.textContent = `${t("proofErrGeneric")} (${payErr.message})`;
        return;
      }

      okOut.textContent = t("proofSentOk");
      showToast(t("toastSaved"));
      await refreshDashboardData();
    };
  });

  // View uploaded proof via signed URL
  $("bookingsContainer").querySelectorAll("[data-view-proof]").forEach(btn => {
    btn.onclick = async () => {
      const { data, error } = await sb.storage.from(PROOFS_BUCKET).createSignedUrl(btn.dataset.viewProof, 300);
      if (error || !data?.signedUrl) {
        showToast(error?.message || t("proofErrGeneric"));
        return;
      }
      window.open(data.signedUrl, "_blank", "noopener");
    };
  });

  // Open QR booking pass
  $("bookingsContainer").querySelectorAll("[data-open-bon]").forEach(btn => {
    btn.onclick = () => openBookingPassModal(btn.dataset.openBon);
  });

  // Request cancellation
  $("bookingsContainer").querySelectorAll("[data-cancel-bk]").forEach(btn => {
    btn.onclick = async () => {
      const reason = prompt(t("cancelPrompt"));
      if (reason === null) return;
      const { data, error } = await sb.rpc("request_cancellation", {
        p_booking: btn.dataset.cancelBk,
        p_reason: reason
      });
      if (error || !data || !data.ok) showToast(t("cancelFail"));
      else {
        showToast(t("cancelOk"));
        await refreshDashboardData();
      }
    };
  });
}

/* ============================================================================
   10. BOOKING PASS + QR CODE MODAL
   ============================================================================ */
function openBookingPassModal(bookingId) {
  const bk = BOOKINGS.find(item => String(item.id) === String(bookingId));
  if (!bk) return;

  const fmtDate = d => new Date(d).toLocaleDateString(LANG === "ar" ? "ar-TN" : "fr-FR", {
    timeZone: "Africa/Tunis"
  });
  const refCode = String(bk.id).slice(0, 8).toUpperCase();

  $("bonRefLine").textContent = `${t("bonRef")}: #${refCode}`;
  $("bonRows").innerHTML = `
    <div><b>${t("bonClient")}:</b> ${esc(bk.guest_name || PROFILE?.full_name || "")}</div>
    <div><b>${t("bonPhone")}:</b> <span dir="ltr">${esc(bk.guest_phone || PROFILE?.phone || "")}</span></div>
    <div><b>${t("bonCar")}:</b> ${esc(bk.vehicles?.name || "")}</div>
    <div><b>${t("bonPeriod")}:</b> ${t("from")} ${fmtDate(bk.start_at)} ${t("to")} ${fmtDate(bk.end_at)} (${esc(bk.quote?.days ?? "")} ${t("days")})</div>
    ${bk.pickup_text ? `<div><b>${t("bonPickup")}:</b> ${esc(bk.pickup_text)}</div>` : ""}
  `;

  const qrData = JSON.stringify({
    brand: "AMINE_RENT_A_CAR",
    booking_id: bk.id,
    ref: refCode,
    status: bk.status
  });

  if (window.QRCode) {
    QRCode.toCanvas($("bonQrCanvas"), qrData, { width: 152, margin: 1 }, err => {
      if (err) console.error(err);
    });
  }

  $("bonModal").hidden = false;
}

$("bonCloseBtn").onclick = () => { $("bonModal").hidden = true; };
$("bonModal").onclick = e => { if (e.target === $("bonModal")) $("bonModal").hidden = true; };
$("bonPrintBtn").onclick = () => window.print();

/* ============================================================================
   11. SAVE PROFILE, ID DOCS (CIN / PASSPORT), LICENSE & FLIGHT TICKET
   ============================================================================ */
async function uploadDocumentFile(fileInput, subFolder) {
  const file = fileInput.files[0];
  if (!file) return null;
  const extMap = {
    "image/jpeg": "jpg",
    "image/png": "png",
    "image/webp": "webp",
    "application/pdf": "pdf"
  };
  const ext = extMap[file.type];
  if (!ext || file.size > 5 * 1024 * 1024) {
    throw new Error(t("errFileType"));
  }
  const path = `${subFolder}/${PROFILE.id}_${Date.now()}.${ext}`;
  const up = await sb.storage.from(DOCS_BUCKET).upload(path, file, { contentType: file.type });
  if (up.error) throw new Error(up.error.message);
  return path;
}

$("saveProfileBtn").onclick = async () => {
  $("profOk").textContent = "";
  $("profErr").textContent = "";
  $("saveProfileBtn").disabled = true;
  const origTxt = $("saveProfileBtn").textContent;
  $("saveProfileBtn").textContent = t("savingProfile");

  try {
    const uploadedIdPath = await uploadDocumentFile($("idDocFileInp"), "id_docs");
    const uploadedLicPath = await uploadDocumentFile($("licFileInp"), "licenses");

    const payload = {
      full_name: $("profName").value.trim(),
      phone: $("profPhone").value.trim(),
      billing_address: $("profAddr").value.trim(),
      tax_id: $("profTax").value.trim(),
      id_doc_type: $("idDocTypeSel").value,
      id_doc_number: $("idDocNumInp").value.trim(),
      flight_ticket: $("flightInp").value.trim()
    };

    if (uploadedIdPath) payload.id_doc_path = uploadedIdPath;
    if (uploadedLicPath) payload.license_path = uploadedLicPath;

    const { error } = await sb.from("profiles").update(payload).eq("id", PROFILE.id);
    if (error) throw new Error(error.message);

    Object.assign(PROFILE, payload);
    $("idDocFileInp").value = "";
    $("licFileInp").value = "";
    $("profOk").textContent = t("profileSavedOk");
    showToast(t("toastSaved"));
    await renderIdentityHeader();
    await renderStoredDocumentLinks();
  } catch (err) {
    $("profErr").textContent = `${t("profileSaveErr")} (${err.message})`;
  } finally {
    $("saveProfileBtn").disabled = false;
    $("saveProfileBtn").textContent = origTxt;
  }
};

/* ============================================================================
   12. INITIALIZATION
   ============================================================================ */
applyLanguage();
bootstrapClientApp();
</script>
</body>
