<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Amine Rent A Car | Espace Client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --ink:#12161B;--ink-2:#1E252E;--paper:#EEF0EC;--surface:#FFFFFF;--surface-2:#F8F9F7;--surface-3:#F1F3EE;
  --red:#D62828;--red-dark:#A61B1B;--red-soft:rgba(214,40,40,.09);
  --green:#1B9952;--green-dark:#13743D;--green-soft:rgba(27,153,82,.11);
  --gold:#C9A227;--gold-soft:rgba(201,162,39,.16);
  --wa:#128C7E;--wa-dark:#0B6B60;
  --line:#D7D9D3;--line-strong:#BFC4BA;--text:#1B1F24;--muted:#5A6068;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;
  --shadow-sm:0 4px 14px rgba(18,22,27,.05);--shadow-md:0 10px 28px rgba(18,22,27,.08);--shadow-lg:0 22px 54px rgba(18,22,27,.18);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.4,.64,1);
  --font-display:"Barlow Condensed","Cairo",sans-serif;--font-body:"Cairo",system-ui,-apple-system,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.58;background:var(--paper);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 14%,rgba(214,40,40,.06),transparent 42%),radial-gradient(circle at 88% 18%,rgba(201,162,39,.08),transparent 45%),radial-gradient(circle at 50% 92%,rgba(27,153,82,.06),transparent 48%)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;line-height:1.15;color:var(--ink)}

/* Header & 4-Lang Switcher */
header{position:sticky;top:0;z-index:40;background:linear-gradient(95deg,var(--ink) 0%,var(--ink-2) 65%,#27191C 100%);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--red);box-shadow:0 6px 22px rgba(0,0,0,.16)}
.brand-link{text-decoration:none;color:#fff;font-family:var(--font-display);font-size:23px;font-weight:800;letter-spacing:.03em}
.hx{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lang-bar{display:inline-flex;background:rgba(255,255,255,.08);padding:3px;border-radius:9px;gap:2px}
.lang-bar button{background:transparent;color:#d8dde3;padding:4px 9px;font-size:12px;border-radius:7px;box-shadow:none!important}
.lang-bar button.on{background:var(--gold);color:var(--ink);font-weight:800}

/* Layout & Cards */
main{max-width:920px;margin:0 auto;padding:22px 16px 96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm);animation:cardEnter .38s var(--ease-out) both}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md)}
@keyframes cardEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13.5px}

/* Visual Guide Strip */
.visual-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.v-tile{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;align-items:center;gap:10px}
.v-icon{width:42px;height:42px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v-tile b{display:block;font-size:13px;color:var(--ink)}
.v-tile span{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}

/* Inputs & Auto-Flag Phone Input */
label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:12px 0 5px}
input,select{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-family:var(--font-body);font-size:14.5px;color:var(--text);background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(201,162,39,.22);outline:none}
input[type=file]{padding:7px 10px;background:var(--surface-2);cursor:pointer}

.phone-auto{position:relative;display:flex;align-items:center}
.phone-auto input{padding-inline-end:86px;font-family:var(--font-mono);font-size:15px}
.auto-badge{position:absolute;inset-inline-end:8px;background:var(--surface-3);border:1px solid var(--line);border-radius:8px;padding:4px 9px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--ink-2);pointer-events:none;transition:transform .25s var(--ease-spring)}
.auto-badge.pop{transform:scale(1.1);border-color:var(--gold)}

.pw-wrap{position:relative}
.pw-eye{position:absolute;top:50%;inset-inline-end:8px;transform:translateY(-50%);background:transparent;color:var(--muted);padding:4px 8px;font-size:14px;box-shadow:none!important}
.pw-meter{height:5px;border-radius:99px;background:#e2e5df;margin-top:6px;overflow:hidden}
.pw-meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}

/* Buttons & Tabs */
button,.btn{border:0;border-radius:var(--r-sm);padding:10px 16px;font-family:var(--font-body);font-size:13.5px;font-weight:700;color:#fff;background:var(--red);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:transform .18s var(--ease-spring),background-color .2s,box-shadow .2s}
button:hover:not(:disabled),.btn:hover{transform:translateY(-1.5px);box-shadow:0 6px 16px rgba(18,22,27,.14)}
button:active:not(:disabled),.btn:active{transform:scale(.98)}
button:disabled{opacity:.55;cursor:not-allowed}
.dark{background:var(--ink)}.green{background:var(--green)}.ghost{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)}
.sm{padding:6px 12px;font-size:12.5px;border-radius:7px}.full{width:100%;margin-top:16px;padding:12px;font-size:14.5px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tabs button{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);padding:11px 10px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);padding:6px 12px;font-size:12.5px}
.pills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Alerts & Trust Box */
.err{color:var(--red);font-weight:700;font-size:13px;margin-top:10px;background:var(--red-soft);padding:8px 12px;border-radius:8px;border-inline-start:3px solid var(--red)}
.ok{color:var(--green-dark);font-weight:700;font-size:13px;margin-top:10px;background:var(--green-soft);padding:8px 12px;border-radius:8px;border-inline-start:3px solid var(--green)}
.err:empty,.ok:empty{display:none}
.warn{background:#FFF7E0;border-inline-start:4px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:13px;color:#3D3110;margin:8px 0}
.trust-panel{margin-top:14px;background:linear-gradient(135deg,#F3F8F5 0%,#FBF9F0 100%);border:1px solid #C7DFD0;border-inline-start:4px solid var(--green);border-radius:var(--r-md);padding:13px 15px}
.trust-title{font-weight:800;font-size:14px;color:var(--green-dark);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.trust-copy{font-size:13px;color:#25332B}

/* Hero & Progress */
.avatar{width:68px;height:68px;border-radius:50%;border:2.5px solid var(--gold);background:linear-gradient(135deg,var(--ink),var(--ink-2));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:28px;font-weight:800;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.vip-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--green-dark);background:var(--green-soft);padding:2px 10px;border-radius:999px}
.prog{margin-top:16px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.bar{height:9px;border-radius:99px;background:#DFE3DC;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#25B865);border-radius:99px;transition:width .5s var(--ease-out)}
.dots{display:flex;gap:6px;margin-top:9px}
.dots b{flex:1;height:5px;border-radius:99px;background:#DFE3DC}.dots b.d{background:var(--green)}.dots b.c{background:var(--gold)}

/* Steps & Bookings */
.step{border:1.5px solid var(--line);border-radius:var(--r-md);margin-top:11px;background:#fff}
.step[open]{border-color:var(--ink)}
.step summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 15px;user-select:none}
.step summary::-webkit-details-marker{display:none}
.num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:800 17px var(--font-display);flex-shrink:0}
.step.done .num{background:var(--green)}
.stt{flex:1;font-weight:800}.stt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.chip{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:#785B0A}
.step.done .chip{background:var(--green-soft);color:var(--green-dark)}.chip.opt{background:var(--surface-3);color:var(--muted)}
.sbody{padding:2px 15px 16px;border-top:1px solid var(--line)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.bk{border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:14px;background:var(--surface-2)}
.bk:hover{border-color:var(--line-strong);background:#fff}
.car{font-family:var(--font-display);font-size:23px;font-weight:800;color:var(--ink)}
.ref-tag{font-family:var(--font-mono);font-size:12.5px;font-weight:700;background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:6px;color:var(--ink-2);direction:ltr;display:inline-block}
.badge{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;color:#fff;background:#6F767E}
.badge.pending{background:var(--gold);color:var(--ink)}.badge.confirmed{background:var(--green)}.badge.cancellation_requested{background:#E67E22}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.flow span{background:#ECEEE9;border-radius:8px;padding:6px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;border:1px solid transparent}
.flow .d{background:var(--green-soft);color:var(--green-dark);border-color:rgba(27,153,82,.28)}.flow .c{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-top:10px}
.rib-panel{background:#fff;border:1.5px dashed var(--line-strong);border-radius:var(--r-md);padding:12px 14px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}td{padding:6px 0;border-bottom:1px solid #ECEEE9}td:last-child{text-align:end;font-weight:700;font-family:var(--font-mono)}tr:last-child td{border-bottom:0}
.dep{background:var(--gold-soft);padding:8px 10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.rib{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--red-dark);background:var(--surface-3);padding:4px 9px;border-radius:6px;border:1px solid var(--line);margin-top:4px;display:inline-block;direction:ltr}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

/* Floating WA, Toast & Modal */
.wa{position:fixed;bottom:18px;inset-inline-start:18px;z-index:45;background:var(--wa);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:0 12px 26px rgba(18,140,126,.34)}
.toast{position:fixed;bottom:18px;inset-inline-end:18px;z-index:80;background:var(--ink);color:#fff;border-inline-start:4px solid var(--green);border-radius:var(--r-md);padding:11px 16px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-lg)}
.modal{position:fixed;inset:0;background:rgba(12,15,19,.68);backdrop-filter:blur(3px);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:var(--r-xl);max-width:580px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:var(--shadow-lg)}
.bonb{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:16px;font-size:14px}.bonb>div:first-child{display:grid;gap:7px}
.qr-card{text-align:center;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--surface-2)}

@media(max-width:680px){.visual-strip,.g2,.bonb{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.tabs{grid-template-columns:1fr}}
@media print{header,.wa,.toast,.np{display:none!important}.modal{position:static;background:none;backdrop-filter:none}.sheet{box-shadow:none;padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <a class="brand-link" href="index.html">AMINE RENT A CAR</a>
  <div class="hx">
    <div class="lang-bar" role="group" aria-label="Language">
      <button type="button" data-lang="ar">AR</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="it">IT</button>
    </div>
    <button type="button" class="dark sm" id="outBtn" hidden></button>
  </div>
</header>

<main>
  <!-- A. AUTH & QUICK VOUCHER / DEPOSIT -->
  <section id="authSec">
    <div class="tabs">
      <button type="button" class="on" id="tLogin" data-i="tLogin"></button>
      <button type="button" id="tReg" data-i="tReg"></button>
      <button type="button" id="tPay" data-i="tPay"></button>
    </div>

    <div class="card" id="authCard">
      <div class="row">
        <h2 id="authH" style="font-size:28px"></h2>
        <span class="vip-tag">🛡️ <span data-i="secBadge"></span></span>
      </div>
      <p class="sub" data-i="authSub"></p>

      <!-- Visual 3-Step Guide -->
      <div class="visual-strip">
        <div class="v-tile">
          <div class="v-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6"/></svg>
          </div>
          <div><b data-i="vg1t"></b><span data-i="vg1d"></span></div>
        </div>
        <div class="v-tile">
          <div class="v-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B9952" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3"/><path d="M21 14v7h-7"/></svg>
          </div>
          <div><b data-i="vg2t"></b><span data-i="vg2d"></span></div>
        </div>
        <div class="v-tile">
          <div class="v-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D62828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
          </div>
          <div><b data-i="vg3t"></b><span data-i="vg3d"></span></div>
        </div>
      </div>

      <div id="regOnly" hidden>
        <label for="fName" data-i="lName"></label>
        <input id="fName" maxlength="90" autocomplete="name">
      </div>

      <label for="fUser" id="lUser"></label>
      <input id="fUser" maxlength="40" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false">
      <div class="sub" id="userHint"></div>

      <div id="phoneBox">
        <label for="fPhone" data-i="lPhone"></label>
        <div class="phone-auto">
          <input id="fPhone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel">
          <span class="auto-badge" id="autoFlag"><span id="flagIcon">🇹🇳</span><span id="ccLabel">+216</span></span>
        </div>
        <div class="sub" data-i="phoneAutoHint" style="margin-top:4px"></div>
      </div>

      <label for="fPass" data-i="lPass"></label>
      <div class="pw-wrap">
        <input id="fPass" type="password" maxlength="128" autocomplete="current-password">
        <button type="button" class="pw-eye" id="togglePw" aria-label="Password">👁️</button>
      </div>
      <div class="pw-meter" id="pwMeter" hidden><i id="pwBar"></i></div>

      <button type="button" class="full" id="authBtn"></button>

      <div id="forgotBox" style="margin-top:12px;font-size:13px">
        <span data-i="forgotTxt"></span>
        <a href="#" id="forgotLink" target="_blank" rel="noopener noreferrer" style="color:var(--wa);font-weight:800">22192727</a>
      </div>

      <div class="err" id="authErr" role="alert"></div>
      <div class="ok" id="authOk" role="status"></div>
    </div>

    <!-- Quick Voucher & Deposit Card -->
    <div class="card" id="payCard" hidden>
      <h2 style="font-size:28px" data-i="payH"></h2>
      <p class="sub" data-i="paySub"></p>

      <div id="qpGate">
        <label for="qpId" data-i="lQpId"></label>
        <input id="qpId" dir="ltr" maxlength="40" placeholder="Ex: A8F92C1B" style="text-transform:uppercase">
        <label for="qpPh" data-i="lQpPh"></label>
        <input id="qpPh" type="tel" inputmode="tel" dir="ltr" maxlength="25">
        <button type="button" class="green full" id="qpBtn" data-i="qpBtn"></button>
        <div class="err" id="qpErr" role="alert"></div>
      </div>

      <div id="qpRes" hidden>
        <div class="box"><table id="qpTable"></table><p class="sub" data-i="estNote" style="margin-top:8px"></p></div>
        <div class="rib-panel"><b data-i="ribT"></b><div id="qpBanks"></div></div>

        <details class="box">
          <summary style="cursor:pointer;font-weight:700;font-size:13.5px" data-i="billOptS"></summary>
          <input id="qpBName" maxlength="120" style="margin-top:8px">
          <input id="qpBAddr" maxlength="200" style="margin-top:8px">
          <input id="qpBTax" maxlength="40" style="margin-top:8px">
          <div class="acts"><button type="button" class="dark sm" id="qpBSave" data-i="billSave"></button></div>
          <div class="err" id="qpBErr"></div><div class="ok" id="qpBOk"></div>
        </details>

        <div class="box">
          <b data-i="proofT"></b>
          <div class="warn" data-i="warn"></div>
          <div class="acts" style="margin-top:4px">
            <input id="qpFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" style="max-width:300px">
            <button type="button" class="green sm" id="qpSend" data-i="send"></button>
          </div>
          <div class="err" id="qpUpErr" role="alert"></div>
          <div class="ok" id="qpUpOk" role="status"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- B. CLIENT DASHBOARD -->
  <section id="app" hidden>
    <div class="card">
      <div class="row">
        <div style="display:flex;align-items:center;gap:14px">

/* ---------- Sécurité : Rate Limit, Auto-Lock & Magic Bytes ---------- */
let failCount=0,lockUntil=0,idleTimer=null;
const checkLock=()=>Math.max(0,Math.ceil((lockUntil-Date.now())/1000));
const recordFail=()=>{failCount++;if(failCount>=5)lockUntil=Date.now()+Math.min(120,failCount*10)*1000};
function clearToken(){
  TOKEN="";try{sessionStorage.removeItem(SESSION_KEY)}catch(_){}
}
function setToken(tok){
  TOKEN=tok||"";try{if(TOKEN)sessionStorage.setItem(SESSION_KEY,TOKEN);else sessionStorage.removeItem(SESSION_KEY)}catch(_){}
}
function resetIdle(){
  clearTimeout(idleTimer);if(!PROFILE)return;
  idleTimer=setTimeout(()=>{clearToken();PROFILE=null;BOOKINGS=[];$("app").hidden=true;$("outBtn").hidden=true;$("authSec").hidden=false;toast(t("idleOut"))},20*60*1000);
}
["click","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

async function validateFileSecure(file,maxMB=5,allowPdf=true){
  if(!file||!EXT[file.type]||file.size===0||file.size>maxMB*1048576)return false;
  if(!allowPdf&&file.type==="application/pdf")return false;
  try{
    const b=new Uint8Array(await file.slice(0,12).arrayBuffer());
    if(file.type==="image/jpeg")return b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF;
    if(file.type==="image/png")return b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47;
    if(file.type==="image/webp")return b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46&&b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50;
    if(file.type==="application/pdf")return b[0]===0x25&&b[1]===0x50&&b[2]===0x44&&b[3]===0x46;
  }catch(_){return false}
  return false;
}

function detectCountryFromPhone(raw){
  const d=String(raw||"").replace(/\D/g,"").replace(/^00/,"");
  for(const [code,flag] of PREFIXES){
    if(d.startsWith(code) && d.length>code.length)return{code:"+"+code,flag};
  }
  return{code:"+216",flag:"🇹🇳"};
}

  $("flagIcon").textContent=det.flag;

$("authBtn").onclick=async()=>{
  $("authErr").textContent=$("authOk").textContent="";
  const wait=checkLock();if(wait>0){$("authErr").textContent=t("eLock")(wait);return}
  const pw=$("fPass").value,id=slug($("fUser").value);
  if(pw.length<8){$("authErr").textContent=t("ePass");return}

  $("authBtn").disabled=true;
  try{
    if(MODE==="register"){
      const name=$("fName").value.trim(),d=digits($("fPhone").value);
      if(name.length<2){$("authErr").textContent=t("eName");return}
      if(!/^[a-z0-9_]{3,40}$/.test(id)){$("authErr").textContent=t("eUser");return}
      if(d.length<6){$("authErr").textContent=t("ePhone");return}
      const det=detectCountryFromPhone($("fPhone").value);
      const {data,error}=await sb.rpc("register_client",{
        p_full_name:name,
        p_username:id,
        p_phone:det.code+d,
        p_password:pw
      });
      if(error||!data?.ok){
        const code=data?.error||"";
        $("authErr").textContent=code==="username_taken"?t("eTaken"):code==="invalid_username"?t("eUser"):code==="invalid_phone"?t("ePhone"):t("eGeneric");
        return;
      }
      setToken(data.token);
    }else{
      if(!id){recordFail();$("authErr").textContent=t("eCreds");return}
      const {data,error}=await sb.rpc("login_client",{p_identifier:id,p_password:pw});
      if(error||!data?.ok){recordFail();$("authErr").textContent=t("eCreds");return}
      setToken(data.token);
    }
    failCount=0;lockUntil=0;$("fPass").value="";await loadPortal();
  }catch(_){$("authErr").textContent=t("eGeneric")}finally{$("authBtn").disabled=false}
};

  if(k==="s2")return `<div class="g2"><div><label>${t("lIdType")}</label><select data-f="id_doc_type"><option value="cin"${P.id_doc_type!=="passport"?" selected":""}>CIN</option><option value="passport"${P.id_doc_type==="passport"?" selected":""}>Passeport</option></select></div><div><label>${t("lIdNum")}</label><input data-f="id_doc_number" dir="ltr" maxlength="45" value="${esc(P.id_doc_number)}"></div></div><label>${t("lIdFile")}</label><input type="file" data-file="id_doc_path" data-dir="id_docs" accept="image/jpeg,image/png,image/webp,application/pdf"><div data-lnk="id_doc_path" style="margin-top:6px"></div>`;
  if(k==="s3")return `<div class="g2"><div><label>${t("lLicNum")}</label><input data-f="license_number" dir="ltr" maxlength="40" value="${esc(P.license_number)}"></div><div><label>${t("lLicDate")}</label><input data-f="license_date" type="date" dir="ltr" max="${today}" value="${esc(P.license_date)}"></div><div><label>${t("lBirth")}</label><input data-f="birth_date" type="date" dir="ltr" max="${today}" value="${esc(P.birth_date)}"></div></div><label>${t("lLicFile")}</label><input type="file" data-file="license_path" data-dir="licenses" accept="image/jpeg,image/png,image/webp,application/pdf"><div data-lnk="license_path" style="margin-top:6px"></div>`;
  return `<label>${t("lFlight")}</label><input data-f="flight_ticket" dir="ltr" maxlength="70" value="${esc(P.flight_ticket)}">`;
}
async function renderSteps(){
  const open=progress();
  $("steps").innerHTML=STEPS.map((s,i)=>{
    const d=s.done(PROFILE),chip=d?t("done"):s.req?t("todo"):t("opt");
    return `<details class="step ${d?"done":""}" data-k="${s.k}"${i===open?" open":""}><summary><span class="num">${d?"✓":i+1}</span><span class="stt">${t(s.k)}<small>${t(s.k+"d")}</small></span><span class="chip ${!d&&!s.req?"opt":""}">${chip}</span></summary><div class="sbody">${stepFields(s.k)}<div class="acts"><button type="button" class="green sm" data-save="${s.k}">${t("saveStep")}</button></div><div class="err"></div><div class="ok"></div></div></details>`;
  }).join("");
  document.querySelectorAll("[data-lnk]").forEach(async el=>{const u=await signed(PROFILE[el.dataset.lnk],300);if(u)el.innerHTML=`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" style="color:var(--red);font-weight:700;font-size:13px">${t("view")}</a>`});
  document.querySelectorAll("[data-save]").forEach(btn=>btn.onclick=()=>saveStep(btn));
}
async function saveStep(btn){
  const k=btn.dataset.save,box=btn.closest(".sbody"),er=box.querySelector(".err"),ok=box.querySelector(".ok");
  er.textContent=ok.textContent="";
  const payload={};
  box.querySelectorAll("[data-f]").forEach(i=>payload[i.dataset.f]=i.type==="date"?(i.value||null):i.value.trim());
  btn.disabled=true;const old=btn.textContent;btn.textContent=t("saving");
  try{
    for(const fi of box.querySelectorAll("[data-file]")){
      const f=fi.files[0];if(!f)continue;
      if(!(await validateFileSecure(f,5,true)))throw new Error(t("badFile"));
      const path=`${fi.dataset.dir}/${PROFILE.id}_${Date.now()}.${EXT[f.type]}`;
      const up=await sb.storage.from(DOCS).upload(path,f,{contentType:f.type});
      if(up.error)throw new Error(t("eGeneric"));
      payload[fi.dataset.file]=path;
    }
    const m={...PROFILE,...payload};
    if(k==="s1"&&!(m.full_name&&m.phone))throw new Error(t("needS1"));
    if(k==="s2"&&!(m.id_doc_number&&m.id_doc_path))throw new Error(t("needS2"));
    if(k==="s3"&&!(m.license_number&&m.license_date&&m.birth_date&&m.license_path))throw new Error(t("needS3"));
    await patchProfile(payload);
    toast(t("saved"));await renderSteps();renderHero();
  }catch(e){er.textContent=e.message;btn.disabled=false;btn.textContent=old}
}
