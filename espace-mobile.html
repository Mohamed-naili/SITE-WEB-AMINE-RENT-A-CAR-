function resetIdle(){

}

async function validateFileSecure(file,maxMB=5,allowPdf=true){
  if(!file||!EXT[file.type]||file.size===0||file.size>maxMB*1048576)return false;
  if(!allowPdf&&file.type==="application/pdf")return false;
  try{
    const b=new Uint8Array(await file.slice(0,12).arrayBuffer());
    if(file.type==="image/jpeg")return b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF;
    if(file.type==="image/png")return b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47;
    if(file.type==="image/webp")return b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46&&b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50;
    if(file.type==="application/pdf")return b[0]===0x25&&b[1]===0x50&&b[2]===0x44&&b[3]===0x46;
  }catch(_){return false}
  return false;
}

const digits=v=>String(v||"").replace(/\D/g,"").replace(/^0+/,"");
const cleanPh=v=>String(v||"").replace(/[\s.-]/g,"").replace(/^\+?216/,"").trim();
const fmtD=d=>new Date(d).toLocaleDateString(LANG==="ar"?"ar-TN":LANG==="it"?"it-IT":LANG==="en"?"en-GB":"fr-FR",{timeZone:"Africa/Tunis"});

function detectCountryFromPhone(raw){
  const d=String(raw||"").replace(/\D/g,"").replace(/^00/,"");
  for(let i=0;i<PREFIXES.length;i++){
    const code=PREFIXES[i][0],flag=PREFIXES[i][1];
    if(d.startsWith(code) && d.length>code.length)return{code:"+"+code,flag:flag};
  }
  return{code:"+216",flag:"🇹🇳"};
}
function syncAutoPhone(anim){
  const phVal=$("fPhone").value.trim();
  const det=detectCountryFromPhone(phVal);
  $("flagIcon").textContent=det.flag;
  $("ccLabel").textContent=det.code;
  if(anim){const b=$("autoFlag");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}
  $("forgotLink").href="https://wa.me/"+ADMIN_WA+"?text="+encodeURIComponent(t("waMsg")(phVal));
}
$("fPhone").oninput=()=>syncAutoPhone(true);

  const v=$("fPass").value;$("pwMeter").hidden=!v;if(!v)return;
  let sc=(v.length>=8)+(v.length>=11)+(/[A-Z]/.test(v)&&/[a-z]/.test(v))+(/\d/.test(v)||/[^A-Za-z0-9]/.test(v));
  $("pwBar").style.width=Math.min(100,sc*25)+"%";
  $("pwBar").style.background=sc<=1?"var(--red)":sc<=2?"var(--gold)":"var(--green)";

function setMode(m){
  MODE=m;
  [["tLogin","login"],["tReg","register"],["tPay","pay"]].forEach(pair=>$(pair[0]).classList.toggle("on",m===pair[1]));
  $("authCard").hidden=m==="pay";$("payCard").hidden=m!=="pay";

  $("pwMeter").hidden=m!=="register"||!$("fPass").value;
  $("fPass").autocomplete=m==="register"?"new-password":"current-password";
  $("authErr").textContent=$("authOk").textContent="";

$("authBtn").onclick=async()=>{
  if(!sb){$("authErr").textContent=t("eGeneric");return}
  $("authErr").textContent=$("authOk").textContent="";
  const wait=checkLock();if(wait>0){$("authErr").textContent=t("eLock")(wait);return}
  const pw=$("fPass").value,rawPh=$("fPhone").value.trim(),d=digits(rawPh);
  if(pw.length<8){$("authErr").textContent=t("ePass");return}
  if(d.length<6){$("authErr").textContent=t("ePhone");return}

  $("authBtn").disabled=true;
  try{
    if(MODE==="register"){
      const name=$("fName").value.trim();
      const optUser=$("fUser").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
      if(name.length<2){$("authErr").textContent=t("eName");return}
      const det=detectCountryFromPhone(rawPh);
      const {data,error}=await sb.rpc("register_client",{
        p_full_name:name,p_username:optUser,p_phone:det.code+d,p_password:pw
      });
      if(error||!data||!data.ok){
        const code=(data&&data.error)||"";
        $("authErr").textContent=code==="username_taken"?t("eTaken"):code==="invalid_phone"?t("ePhone"):t("eGeneric");
        return;
      }
      setToken(data.token);
    }else{
      const {data,error}=await sb.rpc("login_client",{p_identifier:rawPh,p_password:pw});
      if(error||!data||!data.ok){recordFail();$("authErr").textContent=t("eCreds");return}
      setToken(data.token);
    }
    failCount=0;lockUntil=0;$("fPass").value="";await loadPortal();
  }catch(_){$("authErr").textContent=t("eGeneric")}finally{$("authBtn").disabled=false}
};

};

function ribRows(list,cls){
  return list.length?list.map(a=>`<div class="row" style="padding:8px 0;border-top:1px solid #ECEEE9"><div><b>${esc(a.bank)}</b> · <span class="sub">${esc(a.holder)}</span><br><span class="rib">${esc(a.rib)}</span></div><button type="button" class="dark sm" data-${cls}="${esc(a.rib)}">${t("copy")}</button></div>`).join(""):`<p class="sub">${t("ribE")}</p>`;
}
function bindCopy(root,cls){
  root.querySelectorAll(`[data-${cls}]`).forEach(b=>b.onclick=async()=>{
    try{await navigator.clipboard.writeText(b.dataset[cls])}catch(_){}
    const o=b.textContent;b.textContent=t("copied");toast(t("copied"));setTimeout(()=>b.textContent=o,1400);
  });
}

$("qpBtn").onclick=async()=>{
  if(!sb){$("qpErr").textContent=t("eGeneric");return}
  $("qpErr").textContent="";
  const wait=checkLock();if(wait>0){$("qpErr").textContent=t("eLock")(wait);return}
  const refIn=$("qpId").value.trim().replace(/^#/,""),ph=cleanPh($("qpPh").value);
  if(refIn.length<4||ph.length<6){$("qpErr").textContent=t("qpBad");return}
  $("qpBtn").disabled=true;
  const {data,error}=await sb.rpc("get_payment_info",{p_booking:refIn,p_phone:ph});
  $("qpBtn").disabled=false;
  if(error||!data||!data.ok){recordFail();$("qpErr").textContent=t("qpBad");return}
  failCount=0;QP=data;QPPH=ph;QP_ID=data.booking_id||refIn;
  $("qpGate").hidden=true;$("qpRes").hidden=false;renderQp();
};
function renderQp(){
  const r=[[t("ref"),"#"+shortRef(QP_ID)],[t("days"),QP.days],[t("htva"),money(QP.subtotal_htva)],[t("vat"),(QP.vat_rate??0)+" %"],[t("levy"),money(QP.levy)],[t("ttc"),money(QP.total_estimate)],[`${t("dep")} (${QP.deposit_pct??0} %)`,money(QP.deposit)],[t("rec"),money(QP.received)],[t("rem"),money(QP.remaining)]];
  $("qpTable").innerHTML=r.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("");
  $("qpBanks").innerHTML=ribRows(Array.isArray(QP.accounts)?QP.accounts:[],"qc");bindCopy($("qpBanks"),"qc");
}
$("qpBSave").onclick=async()=>{
  if(!sb)return;
  $("qpBErr").textContent=$("qpBOk").textContent="";
  const {data,error}=await sb.rpc("set_billing",{p_booking:QP_ID,p_phone:QPPH,p_name:$("qpBName").value.trim(),p_address:$("qpBAddr").value.trim(),p_tax:$("qpBTax").value.trim()});
  if(error||!data||!data.ok)$("qpBErr").textContent=t("billErr");else{$("qpBOk").textContent=t("billOk");toast(t("saved"))}
};
$("qpSend").onclick=async()=>{
  if(!sb)return;
  $("qpUpErr").textContent=$("qpUpOk").textContent="";
  const f=$("qpFile").files[0];
  if(!(await validateFileSecure(f,5,true))){$("qpUpErr").textContent=t("badFile");return}
  $("qpSend").disabled=true;const old=$("qpSend").textContent;$("qpSend").textContent=t("sending");
  const path=`${QP_ID}/${Date.now()}.${EXT[f.type]}`;
  const up=await sb.storage.from(PROOFS).upload(path,f,{contentType:f.type});
  let ok=false;
  if(!up.error){const r=await sb.rpc("submit_proof",{p_booking:QP_ID,p_phone:QPPH,p_path:path});ok=!r.error&&r.data&&r.data.ok}
  $("qpSend").disabled=false;$("qpSend").textContent=old;
  if(ok){$("qpUpOk").textContent=t("sentOk");$("qpFile").value="";toast(t("saved"))}else $("qpUpErr").textContent=t("proofErr");
};

async function loadPortal(){
  if(!sb){$("authSec").hidden=false;$("app").hidden=true;return}
  if(!TOKEN){try{TOKEN=sessionStorage.getItem(SESSION_KEY)||""}catch(_){}}
  if(!TOKEN){$("authSec").hidden=false;$("app").hidden=true;return}
  try{
    const {data,error}=await sb.rpc("get_client_portal",{p_token:TOKEN});
    if(error||!data||!data.ok){clearToken();$("authSec").hidden=false;$("app").hidden=true;return}
    PROFILE=data.profile||{};
    BOOKINGS=Array.isArray(data.bookings)?data.bookings:[];
    BANKS=Array.isArray(data.banks)?data.banks:[];
    SET=data.settings||{};
    $("authSec").hidden=true;$("app").hidden=false;$("outBtn").hidden=false;
    resetIdle();renderHero();renderSteps();renderBookings();
  }catch(_){$("authSec").hidden=false;$("app").hidden=true}
}

const STEPS=[
  {k:"s1",req:true,done:p=>!!(p.full_name&&p.phone)},
  {k:"s2",req:true,done:p=>!!(p.id_doc_number&&p.id_doc_path)},
  {k:"s3",req:true,done:p=>!!(p.license_number&&p.license_date&&p.birth_date&&p.license_path)},
  {k:"s4",req:false,done:p=>!!p.flight_ticket}
];
async function signed(path,secs=300){if(!path||!sb)return null;const {data}=await sb.storage.from(DOCS).createSignedUrl(path,secs);return data?.signedUrl||null}
async function renderHero(){
  const n=(PROFILE.full_name||PROFILE.phone||"").trim();
  $("hello").textContent=`${t("hello")}${n?" "+n:""}`;
  const av=$("avatar");av.textContent=(n||"C").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"C";
  const u=await signed(PROFILE.avatar_path,3600);if(u)av.innerHTML=`<img src="${esc(u)}" alt="">`;
}
async function patchProfile(patch){
  const {data,error}=await sb.rpc("save_client_profile",{p_token:TOKEN,p_patch:patch});
  if(error||!data||!data.ok)throw new Error(t("eGeneric"));
  Object.assign(PROFILE,patch);
}
$("avatarFile").onchange=async()=>{
  const f=$("avatarFile").files[0];
  if(!(await validateFileSecure(f,3,false))){toast(t("badFile"));return}
  const path=`avatars/${PROFILE.id}_${Date.now()}.${EXT[f.type]}`;
  const up=await sb.storage.from(DOCS).upload(path,f,{contentType:f.type});
  if(up.error){toast(t("eGeneric"));return}
  try{await patchProfile({avatar_path:path});renderHero();toast(t("saved"))}catch(_){toast(t("eGeneric"))}
};
function progress(){
  const req=STEPS.filter(s=>s.req),done=req.filter(s=>s.done(PROFILE)).length,pct=Math.round(done/req.length*100);
  $("progTitle").textContent=`${t("progT")} · ${t("stepsOf")(done,req.length)}`;
  $("progPct").textContent=pct+"%";$("progBar").style.width=pct+"%";
  const open=STEPS.findIndex(s=>s.req&&!s.done(PROFILE));
  $("dots").innerHTML=req.map((s,i)=>`<b class="${s.done(PROFILE)?"d":i===open?"c":""}"></b>`).join("");
  return open;
}
function stepFields(k){
  const P=PROFILE,today=new Date().toISOString().slice(0,10);
  if(k==="s1")return `<div class="g2"><div><label>${t("lName")}</label><input data-f="full_name" maxlength="120" value="${esc(P.full_name)}"></div><div><label>${t("lPhoneLogin")}</label><input data-f="phone" type="tel" dir="ltr" maxlength="32" value="${esc(P.phone)}"></div><div><label>${t("lAddr")}</label><input data-f="billing_address" maxlength="200" value="${esc(P.billing_address)}"></div><div><label>${t("lTax")}</label><input data-f="tax_id" maxlength="50" value="${esc(P.tax_id)}"></div></div>`;
  if(k==="s2")return `<div class="g2"><div><label>${t("lIdType")}</label><select data-f="id_doc_type"><option value="cin"${P.id_doc_type!=="passport"?" selected":""}>CIN</option><option value="passport"${P.id_doc_type==="passport"?" selected":""}>Passeport</option></select></div><div><label>${t("lIdNum")}</label><input data-f="id_doc_number" dir="ltr" maxlength="45" value="${esc(P.id_doc_number)}"></div></div><label>${t("lIdFile")}</label><input type="file" data-file="id_doc_path" data-dir="id_docs" accept="image/jpeg,image/png,image/webp,application/pdf"><div data-lnk="id_doc_path" style="margin-top:6px"></div>`;
  if(k==="s3")return `<div class="g2"><div><label>${t("lLicNum")}</label><input data-f="license_number" dir="ltr" maxlength="40" value="${esc(P.license_number)}"></div><div><label>${t("lLicDate")}</label><input data-f="license_date" type="date" dir="ltr" max="${today}" value="${esc(P.license_date)}"></div><div><label>${t("lBirth")}</label><input data-f="birth_date" type="date" dir="ltr" max="${today}" value="${esc(P.birth_date)}"></div></div><label>${t("lLicFile")}</label><input type="file" data-file="license_path" data-dir="licenses" accept="image/jpeg,image/png,image/webp,application/pdf"><div data-lnk="license_path" style="margin-top:6px"></div>`;
  return `<label>${t("lFlight")}</label><input data-f="flight_ticket" dir="ltr" maxlength="70" value="${esc(P.flight_ticket)}">`;
}
async function renderSteps(){
  const open=progress();
  $("steps").innerHTML=STEPS.map((s,i)=>{
    const d=s.done(PROFILE),chip=d?t("done"):s.req?t("todo"):t("opt");
    return `<details class="step ${d?"done":""}" data-k="${s.k}"${i===open?" open":""}><summary><span class="num">${d?"✓":i+1}</span><span class="stt">${t(s.k)}</span><span class="chip ${!d&&!s.req?"opt":""}">${chip}</span></summary><div class="sbody">${stepFields(s.k)}<div class="acts"><button type="button" class="green sm" data-save="${s.k}">${t("saveStep")}</button></div><div class="err"></div><div class="ok"></div></div></details>`;
  }).join("");
  document.querySelectorAll("[data-lnk]").forEach(async el=>{const u=await signed(PROFILE[el.dataset.lnk],300);if(u)el.innerHTML=`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" style="color:var(--red);font-weight:700;font-size:13px">${t("view")}</a>`});
  document.querySelectorAll("[data-save]").forEach(btn=>btn.onclick=()=>saveStep(btn));
}
async function saveStep(btn){
  const k=btn.dataset.save,box=btn.closest(".sbody"),er=box.querySelector(".err"),ok=box.querySelector(".ok");
  er.textContent=ok.textContent="";
  const payload={};
  box.querySelectorAll("[data-f]").forEach(i=>payload[i.dataset.f]=i.type==="date"?(i.value||null):i.value.trim());
  btn.disabled=true;const old=btn.textContent;btn.textContent=t("saving");
  try{
    for(const fi of box.querySelectorAll("[data-file]")){
      const f=fi.files[0];if(!f)continue;
      if(!(await validateFileSecure(f,5,true)))throw new Error(t("badFile"));
      const path=`${fi.dataset.dir}/${PROFILE.id}_${Date.now()}.${EXT[f.type]}`;
      const up=await sb.storage.from(DOCS).upload(path,f,{contentType:f.type});
      if(up.error)throw new Error(t("eGeneric"));
      payload[fi.dataset.file]=path;
    }
    const m={...PROFILE,...payload};
    if(k==="s1"&&!(m.full_name&&m.phone))throw new Error(t("needS1"));
    if(k==="s2"&&!(m.id_doc_number&&m.id_doc_path))throw new Error(t("needS2"));
    if(k==="s3"&&!(m.license_number&&m.license_date&&m.birth_date&&m.license_path))throw new Error(t("needS3"));
    await patchProfile(payload);
    toast(t("saved"));await renderSteps();renderHero();
  }catch(e){er.textContent=e.message;btn.disabled=false;btn.textContent=old}
}

document.querySelectorAll(".pills [data-f]").forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;document.querySelectorAll(".pills [data-f]").forEach(x=>x.classList.toggle("on",x===b));renderBookings()});
const isHist=b=>["completed","cancelled","expired"].includes(b.status)||(b.end_at&&new Date(b.end_at)<Date.now()&&b.status!=="pending");
function fin(b,pays){
  const q=b.quote||{},days=+q.days||1,sub=+q.subtotal_htva||0,vr=+(SET.vat_rate??q.vat_rate??19);
  const levy=+(q.levy_total??((+(SET.levy_per_day??q.levy_per_day??0))*days));
  const stamp=SET.fiscal_stamp_enabled==="true"?+(SET.fiscal_stamp_amount??1):+(q.fiscal_stamp??0);
  const vat=+(q.vat_amount??sub*vr/100),ttc=+(q.total_ttc??sub+vat+levy+stamp);
  const dp=+(SET.deposit_pct??q.deposit_pct??30),dep=+(q.deposit??ttc*dp/100);
  const rec=pays.filter(p=>p.status==="verified").reduce((a,p)=>a+(+p.amount||0),0);
  return{days,sub,vr,vat,levy,stamp,ttc,dp,dep,rec,rem:Math.max(0,ttc-rec)};
}
function renderBookings(){
  const list=BOOKINGS.filter(b=>FILTER==="all"||(FILTER==="history")===isHist(b));
  if(!list.length){$("bkList").innerHTML=`<p class="sub" style="padding:10px 0">${t("empty")}</p>`;return}
  $("bkList").innerHTML=list.map(b=>{
    const ref=shortRef(b.id);
    const pays=[...(b.payments||[])].sort((a,z)=>new Date(z.created_at)-new Date(a.created_at));
    const proof=pays.find(p=>p.proof_path),dead=["cancelled","expired"].includes(b.status);
    const verified=!dead&&pays.some(p=>p.status==="verified"),pend=!dead&&!verified&&pays.some(p=>p.status==="proof_uploaded");
    const hist=isHist(b),f=fin(b,pays),live=!hist&&["pending","confirmed"].includes(b.status);
    const conf=b.status==="confirmed"||verified;
    const c=["d",conf||proof?"d":b.status==="pending"?"c":"d",verified?"d":proof?"c":"",conf?"d":""];
    const st=(hist&&b.status==="confirmed")?t("status").completed:(t("status")[b.status]||b.status);
    return `<article class="bk">
      <div class="row">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="car">${esc(b.vehicles?.name||"")}</div><span class="ref-tag">#${esc(ref)}</span></div>
        <span class="badge ${esc(b.status)}">${esc(st)}</span>
      </div>
      <div class="sub" style="margin-top:4px">${t("from")} <b>${fmtD(b.start_at)}</b> ${t("to")} <b>${fmtD(b.end_at)}</b> · ${f.days} ${t("days")}${b.pickup_text?" · "+esc(b.pickup_text):""}</div>
      <div class="flow">${["st1","st2","st3","st4"].map((k,i)=>`<span class="${c[i]}">${t(k)}</span>`).join("")}</div>
      ${verified?`<div class="ok">✓ ${t("paid")}</div>`:""}
      ${pend?`<div class="warn" style="margin:6px 0">⏳ ${t("wait")}</div>`:""}
      ${f.sub>0?`<div class="box"><b>${t("finT")}</b><table><tr><td>${t("htva")}</td><td>${money(f.sub)}</td></tr><tr><td>${t("vat")} (${f.vr} %)</td><td>${money(f.vat)}</td></tr>${f.levy>0?`<tr><td>${t("levy")}</td><td>${money(f.levy)}</td></tr>`:""}${f.stamp>0?`<tr><td>${t("stamp")}</td><td>${money(f.stamp)}</td></tr>`:""}<tr><td><b>${t("ttc")}</b></td><td><b>${money(f.ttc)}</b></td></tr><tr><td>${t("rec")}</td><td>${money(f.rec)}</td></tr><tr><td>${t("rem")}</td><td>${money(f.rem)}</td></tr></table><div class="dep"><span>${t("dep")} (${f.dp} %)</span><span style="font-family:var(--font-mono);color:var(--red-dark)">${money(f.dep)}</span></div></div>`:""}
      ${live?`<div class="rib-panel"><b>${t("ribT")}</b>${ribRows(BANKS,"bc")}</div>
      <details class="box" data-bill="${esc(b.id)}"><summary style="cursor:pointer;font-weight:700;font-size:13.5px">${t("billOptS")}</summary>
        <input class="bn" maxlength="120" placeholder="${esc(t("lName"))}" value="${esc(b.billing_name||PROFILE.full_name||"")}" style="margin-top:8px">
        <input class="ba" maxlength="200" placeholder="${esc(t("lAddr"))}" value="${esc(b.billing_address||PROFILE.billing_address||"")}" style="margin-top:8px">
        <input class="bt" maxlength="50" placeholder="${esc(t("lTax"))}" value="${esc(b.billing_tax_id||PROFILE.tax_id||"")}" style="margin-top:8px">
        <div class="acts"><button type="button" class="dark sm bs">${t("billSave")}</button></div><div class="err be"></div><div class="ok bo"></div>
      </details>
      ${!verified?`<div class="box" data-proof="${esc(b.id)}"><b>${t("proofL")}</b><div class="warn">${t("warn")}</div><div class="acts" style="margin-top:4px"><input type="file" class="pf" accept="image/jpeg,image/png,image/webp,application/pdf"><input type="number" class="pa" min="0" max="99999" step="0.5" placeholder="${esc(t("amtPh"))}"><button type="button" class="green sm ps">${t("send")}</button></div><div class="err pe"></div><div class="ok po"></div></div>`:""}`:""}
      <div class="acts">
        ${conf?`<button type="button" class="green sm" data-bon="${esc(b.id)}">${t("bonBtn")}</button>`:""}
        ${proof?`<button type="button" class="dark sm" data-vp="${esc(proof.proof_path)}">${t("viewProof")}</button>`:""}
        ${(b.invoices||[]).map(i=>`<a class="btn dark sm" target="_blank" rel="noopener noreferrer" href="invoice.html?id=${esc(i.id)}">${i.kind==="credit_note"?t("cn"):t("inv")} ${esc(i.number)}</a>`).join("")}
        ${live?`<button type="button" class="ghost sm" data-cx="${esc(b.id)}">${t("cancel")}</button>`:""}
      </div>
    </article>`;
  }).join("");

  const R=$("bkList");bindCopy(R,"bc");
  R.querySelectorAll("[data-bill]").forEach(bx=>bx.querySelector(".bs").onclick=async()=>{
    bx.querySelector(".be").textContent=bx.querySelector(".bo").textContent="";
    const {data,error}=await sb.rpc("set_billing",{p_booking:bx.dataset.bill,p_phone:cleanPh(PROFILE.phone),p_name:bx.querySelector(".bn").value.trim(),p_address:bx.querySelector(".ba").value.trim(),p_tax:bx.querySelector(".bt").value.trim()});
    if(error||!data||!data.ok)bx.querySelector(".be").textContent=t("billErr");else{bx.querySelector(".bo").textContent=t("billOk");toast(t("saved"))}
  });
  R.querySelectorAll("[data-proof]").forEach(bx=>bx.querySelector(".ps").onclick=async()=>{
    const er=bx.querySelector(".pe"),ok=bx.querySelector(".po"),btn=bx.querySelector(".ps"),f=bx.querySelector(".pf").files[0];
    er.textContent=ok.textContent="";
    if(!(await validateFileSecure(f,5,true))){er.textContent=t("badFile");return}
    btn.disabled=true;const old=btn.textContent;btn.textContent=t("sending");
    const path=`${PROFILE.id}/${bx.dataset.proof}_${Date.now()}.${EXT[f.type]}`;
    const up=await sb.storage.from(PROOFS).upload(path,f,{contentType:f.type,upsert:false});
    let e2=up.error;
    if(!e2){const r=await sb.from("payments").insert({booking_id:bx.dataset.proof,user_id:PROFILE.id,amount:Math.max(0,+bx.querySelector(".pa").value||0),proof_path:path,status:"proof_uploaded"});e2=r.error}
    btn.disabled=false;btn.textContent=old;
    if(e2){er.textContent=t("proofErr");return}
    toast(t("sentOk"));await loadPortal();
  });
  R.querySelectorAll("[data-vp]").forEach(b=>b.onclick=async()=>{const {data,error}=await sb.storage.from(PROOFS).createSignedUrl(b.dataset.vp,300);if(error||!data?.signedUrl)return toast(t("proofErr"));window.open(data.signedUrl,"_blank","noopener,noreferrer")});
  R.querySelectorAll("[data-bon]").forEach(b=>b.onclick=()=>openBon(b.dataset.bon));
  R.querySelectorAll("[data-cx]").forEach(b=>b.onclick=async()=>{
    const reason=prompt(t("cancelQ"));if(reason===null)return;
    const {data,error}=await sb.rpc("request_cancellation",{p_booking:b.dataset.cx,p_reason:reason.slice(0,300)});
    if(error||!data||!data.ok)toast(t("cancelErr"));else{toast(t("cancelOk"));await loadPortal()}
  });
}

function openBon(id){
  const b=BOOKINGS.find(x=>String(x.id)===String(id));if(!b)return;
  const ref=shortRef(b.id);
  $("bonRef").textContent=`${t("ref")}: #${ref}`;
  $("bonRows").innerHTML=`<div><b>${t("cl")}:</b> ${esc(b.guest_name||PROFILE.full_name||"")}</div><div><b>${t("ph")}:</b> <span dir="ltr">${esc(b.guest_phone||PROFILE.phone||"")}</span></div><div><b>${t("car")}:</b> ${esc(b.vehicles?.name||"")}</div><div><b>${t("per")}:</b> ${t("from")} ${fmtD(b.start_at)} ${t("to")} ${fmtD(b.end_at)} (${esc(b.quote?.days??"")} ${t("days")})</div>${b.pickup_text?`<div><b>${t("pick")}:</b> ${esc(b.pickup_text)}</div>`:""}`;
  if(window.QRCode && typeof window.QRCode.toCanvas==="function"){
    try{window.QRCode.toCanvas($("qr"),JSON.stringify({brand:"AMINE_RENT_A_CAR",ref,status:b.status}),{width:144,margin:1},function(){})}catch(_){}
  }
  $("bon").hidden=false;
}
$("bonX").onclick=()=>$("bon").hidden=true;
$("bon").onclick=e=>{if(e.target===$("bon"))$("bon").hidden=true};
$("bonPrint").onclick=()=>window.print();

setMode(MODE);
loadPortal();
})();
</script>
