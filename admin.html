<style>
:root{--ink:#11161d;--ink2:#1c2430;--paper:#eef0ec;--surface:#fff;--s2:#f8f9f7;--s3:#f1f4ef;--red:#d62828;--red2:#a61c1c;--green:#1b9952;--green2:#13743d;--gold:#c9a227;--blue:#1d5fd6;--line:#d7d9d3;--line2:#c3c8be;--muted:#5a6068;--text:#1b2026;--r:14px;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Work Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;background:var(--paper);color:var(--text);min-height:100vh}

h1,h2,h3{font-family:"Barlow Condensed",sans-serif;font-weight:800;line-height:1.12;color:var(--ink)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:40;background:linear-gradient(95deg,var(--ink),var(--ink2) 62%,#2a171a);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--red);box-shadow:0 6px 20px rgba(0,0,0,.16)}
.brand{font:800 22px "Barlow Condensed",sans-serif;letter-spacing:.03em;display:inline-flex;align-items:center;gap:8px}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
main{max-width:1140px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(17,22,29,.06);transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--line2);box-shadow:0 12px 26px rgba(17,22,29,.09)}
input,select{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff;color:var(--text);width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(201,162,39,.2);outline:none}
button,.btn{border:0;border-radius:9px;padding:9px 14px;font:700 13.5px inherit;font-family:inherit;color:#fff;background:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .15s,background-color .2s}
button:hover:not(:disabled),.btn:hover{transform:translateY(-1px);background:var(--ink2)}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.55;cursor:not-allowed}
.g{background:var(--green)}.g:hover:not(:disabled){background:var(--green2)}.r{background:var(--red)}.r:hover:not(:disabled){background:var(--red2)}.bl{background:var(--blue)}.wa{background:#128c7e}.gh{background:var(--s3);color:var(--ink);border:1px solid var(--line)}.gh:hover:not(:disabled){background:#e5e9e2}
.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-inline-start:4px solid var(--ink);box-shadow:0 4px 14px rgba(17,22,29,.04)}
.k.green{border-inline-start-color:var(--green)}.k.gold{border-inline-start-color:var(--gold)}.k.blue{border-inline-start-color:var(--blue)}.k.red{border-inline-start-color:var(--red)}
.k small{display:block;font-size:12px;color:var(--muted);font-weight:700}.k b{display:block;font:800 20px var(--mono);margin-top:4px}.k span{font-size:12px;color:var(--muted)}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.cb{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:13px}.cb small{display:block;font-size:12px;color:var(--muted);font-weight:700}.cb b{display:block;font:700 18px var(--mono);margin-top:4px}
.alert{border:1px solid var(--line);border-inline-start:4px solid var(--red);border-radius:11px;padding:11px 14px;background:var(--s2);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{background:var(--red);color:#fff;font:800 12px var(--mono);padding:2px 10px;border-radius:99px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;background:#7c8288}
.st.pending{background:var(--gold);color:#14171a}.st.confirmed{background:var(--green)}.st.cancellation_requested{background:#e67e22}.st.blocked{background:#4b5056}
.msg{color:var(--red);font-weight:700;margin:8px 0}.small{color:var(--muted);font-size:13px}.mono{font-family:var(--mono)}
.tag{font:700 12px var(--mono);background:var(--paper);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.ph-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph{position:relative;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--paper)}.ph img{height:62px;width:92px;object-fit:cover;border-radius:6px;display:block}
.ph button{position:absolute;top:-6px;inset-inline-end:-6px;padding:0 6px;height:20px;border-radius:50%;background:var(--red);font-size:12px}
.vrow{display:grid;grid-template-columns:1.4fr 115px 130px auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.evg{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:end;margin-top:10px}
.bar2{display:grid;grid-template-columns:1fr 200px;gap:10px;margin-bottom:12px}
.toast{position:fixed;bottom:16px;inset-inline-end:16px;z-index:90;background:var(--ink);color:#fff;border-inline-start:4px solid var(--green);border-radius:10px;padding:10px 16px;font-weight:600;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.toast.bad{border-inline-start-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(15,18,22,.68);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:16px;max-width:780px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 46px rgba(0,0,0,.24)}
.ih{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--red);padding-bottom:12px}
.i2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.ib{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.it{width:100%;border-collapse:collapse;margin-top:8px}.it th{background:var(--paper);text-align:left;font-size:12px;padding:8px;border-bottom:1px solid var(--line)}.it td{padding:8px;border-bottom:1px solid var(--line)}.it .am,.itot .am{text-align:right;white-space:nowrap}
.itot{width:65%;margin-left:auto;margin-top:8px}.itot td{padding:4px 8px}.itot .gt td{font-size:16px;font-weight:800;border-top:2px solid var(--ink);padding-top:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px;margin-top:10px}.kv b{color:var(--muted);font-weight:600}
@media(max-width:960px){.kpi{grid-template-columns:1fr 1fr}.cg{grid-template-columns:1fr 1fr}.evg{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.vrow,.ih,.i2,.kpi,.cg,.evg,.bar2{grid-template-columns:1fr}.itot{width:100%}.kv{grid-template-columns:1fr}}
@media print{header,main,.toast,.np{display:none!important}.modal{position:static;background:none;padding:0}.sheet{max-width:none;max-height:none;padding:0}}
</style>
</head>

<script>
"use strict";
const URL_=("https://tadaqaqvtjcnanspcboj.supabase.co"),KEY="sb_publishable_fA2Est6rYrP6Sx1xfyhdOA_IA5TQ6MO";
const IMG=`${URL_}/storage/v1/object/public/vehicle-images/`;
const sb=supabase.createClient(URL_,KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString("fr-FR",{timeZone:"Africa/Tunis"}):"";
const money=n=>Number(n??0).toLocaleString("fr-FR",{minimumFractionDigits:3,maximumFractionDigits:3});
const ref=id=>String(id||"").replace(/[^a-zA-Z0-9]/g,"").slice(0,8).toUpperCase();
const LAB={pending:"En attente",confirmed:"Confirmée",cancelled:"Annulée",expired:"Expirée",cancellation_requested:"Annulation demandée",blocked:"Bloquée"};
const STS=Object.keys(LAB);
const MUTE_KEY="amine_admin_muted_alerts_v1";
let BK=[],PAY=[],INV=[],SET={},PERIOD="all",chan=null,toastT,idleT;
let showHiddenAlerts=false;
let hiddenAlerts=new Set();
try{const raw=JSON.parse(localStorage.getItem(MUTE_KEY)||"[]");if(Array.isArray(raw))hiddenAlerts=new Set(raw.map(String));}catch(_){}
function saveHiddenAlerts(){try{localStorage.setItem(MUTE_KEY,JSON.stringify([...hiddenAlerts]));}catch(_){}}

function notify(m,bad){const t=$("toast");t.textContent=m;t.className="toast"+(bad?" bad":"");t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,bad?4000:2400)}
const fail=e=>notify(e&&e.message?e.message:String(e||"Erreur"),true);
const openModal=h=>{$("mBody").innerHTML=h;$("modal").hidden=false};
$("mClose").onclick=()=>$("modal").hidden=true;
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").hidden=true};
$("mPrint").onclick=()=>window.print();
function download(name,rows){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const objUrl=window.URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(";")).join("\n")],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=objUrl;a.download=name;a.click();setTimeout(()=>window.URL.revokeObjectURL(objUrl),4000);
}
function waLink(phone,text){let d=String(phone||"").replace(/\D/g,"");if(!d)return"";if(String(phone).trim().startsWith("+")||d.startsWith("00"))d=d.replace(/^00/,"");else if(d.length===8)d="216"+d;return`https://wa.me/${d}${text?"?text="+encodeURIComponent(text):""}`}

function calc(b){
  const q=b.quote||{},vr=+(SET.vat_rate??19),lpd=+(SET.levy_per_day??0),days=+q.days||1;
  const stampOn=String(SET.fiscal_stamp_enabled||"").toLowerCase()==="true",stampAmt=stampOn?+(SET.fiscal_stamp_amount??1):0;
  const sub=+q.subtotal_htva||0,levy=+(q.levy_total??lpd*days)||0,stamp=+(q.fiscal_stamp??(sub>0?stampAmt:0))||0;
  const vat=+(q.vat_amount??sub*vr/100)||0,ttc=+(q.total_ttc??sub+vat+levy+stamp)||0;
  const pct=+(SET.deposit_pct??q.deposit_pct??20),dep=+(q.deposit??ttc*pct/100)||0;
  return{sub,levy,stamp,vat,ttc,dep,vr};
}
const verifiedOf=id=>PAY.filter(p=>p.booking_id===id&&p.status==="verified").reduce((s,p)=>s+(+p.amount||0),0);
function inPeriod(d){
  if(PERIOD==="all"||!d)return true;
  const x=new Date(d),n=new Date(),m0=new Date(n.getFullYear(),n.getMonth(),1),m1=new Date(n.getFullYear(),n.getMonth()-1,1);
  return PERIOD==="month"?x>=m0:(x>=m1&&x<m0);
}
function computeAccounting(){
  const vp=PAY.filter(p=>p.status==="verified"&&inPeriod(p.verified_at||p.created_at));
  const cash=vp.reduce((s,p)=>s+(+p.amount||0),0);
  const act=BK.filter(b=>["pending","confirmed","cancellation_requested"].includes(b.status)&&inPeriod(b.start_at));
  let h=0,v=0,lv=0,ttc=0,rest=0;
  act.forEach(b=>{const c=calc(b);h+=c.sub;v+=c.vat;lv+=c.levy+c.stamp;ttc+=c.ttc;rest+=Math.max(0,c.ttc-verifiedOf(b.id))});
  $("stCash").textContent=money(cash)+" TND";$("stCashSub").textContent=`${vp.length} paiement(s) vérifié(s)`;
  $("stRest").textContent=money(rest)+" TND";
  $("stPending").textContent=`${BK.filter(x=>x.status==="pending").length} demande(s) en attente`;
  $("tc").innerHTML=`<div class="card">
    <div class="row" style="margin-bottom:8px"><h3 style="font-size:26px">Comptabilité</h3>
      <div class="np" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select id="period" style="width:auto"><option value="all"${PERIOD==="all"?" selected":""}>Tout</option><option value="month"${PERIOD==="month"?" selected":""}>Ce mois</option><option value="prev"${PERIOD==="prev"?" selected":""}>Mois dernier</option></select>
        <button class="bl" id="cCsv">CSV</button><button class="g" id="cPrint">Imprimer / PDF</button></div></div>
    <div class="cg">
      <div class="cb"><small>Encaissé (vérifié)</small><b style="color:var(--green2)">${money(cash)} TND</b></div>
      <div class="cb"><small>Reste à encaisser (dossiers actifs)</small><b style="color:var(--red2)">${money(rest)} TND</b></div>
      <div class="cb"><small>Volume TTC (dossiers actifs)</small><b>${money(ttc)} TND</b></div>
      <div class="cb"><small>Total HTVA</small><b>${money(h)} TND</b></div>
      <div class="cb"><small>TVA estimée</small><b>${money(v)} TND</b></div>
      <div class="cb"><small>Taxe location + timbre</small><b>${money(lv)} TND</b></div>
    </div>
    <h3 style="font-size:20px;margin:16px 0 8px">Paiements vérifiés</h3>
    ${vp.length?vp.map(p=>`<div class="row" style="border-top:1px solid var(--line);padding:9px 0"><div><b>${esc(p.bookings?.guest_name||"Client")}</b> <span class="small">· ${esc(p.bookings?.vehicles?.name||"")}</span><div class="small">${fmt(p.verified_at||p.created_at)}</div></div><b class="mono" style="color:var(--green2)">+${money(p.amount)} TND</b></div>`).join(""):`<p class="small">Aucun paiement vérifié.</p>`}
  </div>`;
  $("period").onchange=e=>{PERIOD=e.target.value;computeAccounting()};
  $("cPrint").onclick=()=>{const c=$("tc").cloneNode(true);c.querySelectorAll(".np").forEach(x=>x.remove());openModal(c.innerHTML)};
  $("cCsv").onclick=()=>download("comptabilite.csv",[["Indicateur","TND"],["Encaisse verifie",cash.toFixed(3)],["Reste a encaisser",rest.toFixed(3)],["Volume TTC actifs",ttc.toFixed(3)],["HTVA",h.toFixed(3)],["TVA",v.toFixed(3)],["Taxe location + timbre",lv.toFixed(3)]]);
}

function subscribe(){
  if(chan||typeof sb.channel!=="function")return;
  chan=sb.channel("admin_notifications_rt").on("postgres_changes",{event:"INSERT",schema:"public",table:"admin_notifications"},async p=>{
    await Promise.all([loadAlerts(),loadP()]);await loadB();computeAccounting();notify("🔔 "+(p?.new?.title||"Nouvelle notification"));
  }).subscribe();
}
async function loadAlerts(){
  const {data,error}=await sb.from("admin_notifications").select("*").eq("is_read",false).order("created_at",{ascending:false}).limit(50);
  if(error){$("alertsList").innerHTML=`<p class="small">${esc(error.message)}</p>`;return}
  const allUnread=data||[];
  const visible=allUnread.filter(n=>showHiddenAlerts||!hiddenAlerts.has(String(n.id)));
  const hiddenCount=allUnread.filter(n=>hiddenAlerts.has(String(n.id))).length;
  $("stAlerts").textContent=visible.length;$("alertsBadge").textContent=visible.length;
  $("toggleHiddenAlerts").textContent=(showHiddenAlerts?"Masquer masquées":"Masquées")+" ("+hiddenCount+")";
  if(!visible.length){$("alertsList").innerHTML=`<p class="small">Aucune alerte non lue.</p>`;return}
  $("alertsList").innerHTML=visible.map(n=>{
    const idStr=String(n.id);
    const isMuted=hiddenAlerts.has(idStr);
    const p=n.payload||{},when=n.created_at?new Date(n.created_at).toLocaleString("fr-FR",{timeZone:"Africa/Tunis"}):"";
    const meta=[n.client_phone&&`Tél : ${esc(n.client_phone)}`,p.pickup_text&&`Agence : ${esc(p.pickup_text)}`,p.license_number&&`Permis : ${esc(p.license_number)}`,when].filter(Boolean).join(" · ");
    return `<div class="alert"><div><b>${esc(n.title)}</b> — ${esc(n.client_name||"Client")}<div class="small">${meta}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="gh sm" data-mute="${esc(idStr)}">${isMuted?"Réafficher":"Masquer"}</button><button class="g sm" data-read="${esc(idStr)}">Marquer lu</button></div></div>`}).join("");
  $("alertsList").querySelectorAll("[data-mute]").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.mute;
    if(hiddenAlerts.has(k))hiddenAlerts.delete(k);else hiddenAlerts.add(k);
    saveHiddenAlerts();await loadAlerts();
  });
  $("alertsList").querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;const {error:e}=await sb.from("admin_notifications").update({is_read:true}).eq("id",b.dataset.read);
    if(e){b.disabled=false;return fail(e)}hiddenAlerts.delete(String(b.dataset.read));saveHiddenAlerts();await loadAlerts();
  });
}
$("toggleHiddenAlerts").onclick=async()=>{showHiddenAlerts=!showHiddenAlerts;await loadAlerts()};

async function openInvoice(id){

  const s=inv.snapshot,c=s.company||{},cu=s.customer||{},cn=inv.kind==="credit_note",ov=cn?s.original?.vehicle||{}:s.vehicle||{};
  const lines=cn?`<tr><td>Avoir annulant la facture ${esc(s.original_number)}</td><td class="am">${money(s.total_ttc)} TND</td></tr>`
   :`<tr><td>Location ${esc(ov.name)}${ov.plate?` (${esc(ov.plate)})`:""}<div class="small">du ${fmt(s.start_date)} au ${fmt(s.end_date)} : ${esc(s.days)} jour(s) × ${money(s.daily_htva)} TND HTVA</div></td><td class="am">${money(s.subtotal_htva)} TND</td></tr><tr><td>Taxe de location (${money(s.levy_per_day)} × ${esc(s.days)} jour(s))</td><td class="am">${money(s.levy_total)} TND</td></tr>`;
  const tot=cn?`<tr class="gt"><td>Total TTC de l'avoir</td><td class="am">${money(s.total_ttc)} TND</td></tr>`
   :`<tr><td>Sous-total HTVA</td><td class="am">${money(s.subtotal_htva)} TND</td></tr><tr><td>TVA (${esc(s.vat_rate)} %)</td><td class="am">${money(s.vat_amount)} TND</td></tr><tr><td>Taxe de location</td><td class="am">${money(s.levy_total)} TND</td></tr>${+s.fiscal_stamp>0?`<tr><td>Timbre fiscal</td><td class="am">${money(s.fiscal_stamp)} TND</td></tr>`:""}<tr class="gt"><td>Total TTC</td><td class="am">${money(s.total_ttc)} TND</td></tr><tr><td>Acompte versé</td><td class="am">${money(s.deposit_paid)} TND</td></tr><tr><td><b>Reste à payer</b></td><td class="am"><b>${money(s.balance_due)} TND</b></td></tr>`;
  $("mBody").innerHTML=`<div class="ih"><div><h2>${cn?"AVOIR":"FACTURE"}</h2><div><b>N° ${esc(inv.number)}</b></div><div class="small">Émise le ${fmt(inv.issued_at)}</div></div><div style="text-align:center"><canvas id="invQr" width="92" height="92"></canvas><div class="small" style="font-size:10px">QR vérification</div></div><div style="text-align:right"><b>${esc(c.name||"AMINE RENT A CAR")}</b><div class="small">${esc(c.address||"")}<br>MF : ${esc(c.tax_id||"")}<br>${esc(c.phone||"")} ${esc(c.email||"")}</div></div></div>
  <div class="i2"><div class="ib"><div class="small" style="font-weight:700">CLIENT</div><b>${esc(cu.name||"")}</b><div class="small">${esc(cu.address||"")}${cu.tax_id?`<br>MF : ${esc(cu.tax_id)}`:""}<br>${esc(cu.phone||"")}</div></div><div class="ib"><div class="small" style="font-weight:700">${cn?"MOTIF":"PAIEMENT"}</div>${cn?esc(s.reason||""):`Mode : ${esc(s.payment_method||"")}`}</div></div>
  <table class="it"><thead><tr><th>Désignation</th><th class="am">Montant</th></tr></thead><tbody>${lines}</tbody></table><table class="itot">${tot}</table><div class="small" style="margin-top:16px">${esc(s.footer||"")}</div>`;
  const u=location.origin+location.pathname.replace(/[^/]*$/,"")+"verify.html?t="+encodeURIComponent(inv.verify_token||"");
  if(window.QRCode&&window.QRCode.toCanvas){try{window.QRCode.toCanvas($("invQr"),u,{width:92,margin:1},()=>{})}catch(_){}}
}

async function openDossier(b){
  openModal(`<p class="small">Chargement...</p>`);
  if(!b.user_id){$("mBody").innerHTML=`<h3>Dossier client</h3><p class="small" style="margin-top:8px">Cette réservation n'est pas liée à un compte client.</p><div class="kv"><b>Client</b><span>${esc(b.guest_name)}</span><b>Téléphone</b><span>${esc(b.guest_phone)}</span></div>`;return}
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",b.user_id).maybeSingle();
  if(error||!p){$("mBody").innerHTML=`<div class="msg">Dossier introuvable ${esc(error?.message||"")}</div>`;return}
  const link=async(path,label)=>{if(!path)return`<span class="msg" style="margin:0">Manquant</span>`;const {data}=await sb.storage.from("client-documents").createSignedUrl(path,300);return data?.signedUrl?`<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--red);font-weight:700">📎 ${label}</a>`:`<span class="msg" style="margin:0">Illisible</span>`};
  const [idL,licL]=await Promise.all([link(p.id_doc_path,"Voir la pièce"),link(p.license_path,"Voir le permis")]);
  const ok=!!(p.id_doc_number&&p.id_doc_path&&p.license_number&&p.license_date&&p.birth_date&&p.license_path);
  const yrs=p.license_date?((Date.now()-new Date(p.license_date))/31557600000).toFixed(1):"";
  $("mBody").innerHTML=`<h3 style="font-size:26px">Dossier client · #${ref(b.id)}</h3><p class="${ok?"":"msg"} small" style="margin-top:4px">${ok?"✓ Dossier complet pour le contrat":"⚠ Dossier incomplet"}</p>
  <div class="kv"><b>Nom</b><span>${esc(p.full_name)}</span><b>Téléphone</b><span dir="ltr">${esc(p.phone)}</span><b>Date de naissance</b><span>${fmt(p.birth_date)||"—"}</span><b>Adresse</b><span>${esc(p.billing_address)||"—"}</span>
  <b>${p.id_doc_type==="passport"?"Passeport":"CIN"}</b><span class="mono">${esc(p.id_doc_number)||"—"} · ${idL}</span>
  <b>N° permis</b><span class="mono">${esc(p.license_number)||"—"} · ${licL}</span><b>Permis obtenu le</b><span>${fmt(p.license_date)||"—"}${yrs?` (${yrs} an(s))`:""}</span><b>Billet / vol</b><span>${esc(p.flight_ticket)||"—"}</span></div>`;
}

function resetIdle(){clearTimeout(idleT);if(!$("app").hidden)idleT=setTimeout(async()=>{await sb.auth.signOut();boot();notify("Déconnexion automatique")},30*60*1000)}
["click","keydown"].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  const show=ok=>{$("login").hidden=ok;$("app").hidden=!ok;$("out").hidden=$("refreshAll").hidden=!ok};
  if(!session){show(false);return}
  const {data:p,error:pe}=await sb.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
  if(!p||!["admin","staff"].includes(p.role)){
    const why=pe?"erreur base de données : "+pe.message:!p?"aucun profil pour ce compte":"rôle actuel : "+p.role;
    await sb.auth.signOut();show(false);$("lm").textContent="Ce compte n'est pas administrateur ("+why+").";return;
  }
  show(true);try{await sb.rpc("expire_holds")}catch(_){}
  subscribe();await loadAll();resetIdle();
}

  const list=BK.filter(b=>(!st||b.status===st)&&(!q||[b.guest_name,b.guest_phone,ref(b.id),b.vehicles?.name].some(x=>String(x||"").toLowerCase().includes(q))));
  $("bl").innerHTML=list.length?list.map(b=>{
    const c=calc(b),paid=verifiedOf(b.id),hasProof=PAY.some(p=>p.booking_id===b.id&&p.status==="proof_uploaded");
    const wl=waLink(b.guest_phone,`Bonjour ${b.guest_name||""}, réservation #${ref(b.id)} — Amine Rent A Car`);
    return `<div class="card" data-id="${esc(b.id)}">
      <div class="row"><div><b>${esc(b.vehicles?.name)}</b> <span class="tag">#${ref(b.id)}</span></div><span class="st ${esc(b.status)}">${esc(LAB[b.status]||b.status)}</span></div>
      <div>${esc(b.guest_name)} · <a href="tel:${esc(b.guest_phone)}">${esc(b.guest_phone)}</a></div>
      <div class="small">Du ${fmt(b.start_at)} au ${fmt(b.end_at)} · ${esc(b.quote?.days)} jour(s) · ${esc(b.pickup_text)}</div>
      <div class="small">TTC <b class="mono">${money(c.ttc)}</b> · acompte <b class="mono">${money(c.dep)}</b> · vérifié <b class="mono" style="color:${paid>0?"var(--green2)":"var(--red2)"}">${money(paid)}</b> TND${hasProof?" · <b style='color:var(--gold)'>preuve à vérifier</b>":""}</div>
      <div class="row" style="margin-top:8px;justify-content:flex-start">
        ${["pending","cancellation_requested"].includes(b.status)?`<button class="g" data-a="confirmed">Confirmer</button>`:""}
        ${["pending","confirmed","cancellation_requested"].includes(b.status)?`<button class="r" data-a="cancelled">Annuler</button>`:""}
        ${b.status==="confirmed"?`<button class="g" data-inv>Créer la facture</button>`:""}
        <button data-dos>Dossier client</button>${wl?`<a class="btn wa" href="${esc(wl)}" target="_blank" rel="noopener noreferrer">WhatsApp</a>`:""}
      </div>
      <details style="margin-top:8px"><summary class="small" style="cursor:pointer">Prix HTVA et facturation</summary>
        <div style="display:grid;gap:6px;margin-top:6px"><input class="bp" type="number" min="0" step="0.5" value="${esc(b.quote?.subtotal_htva??"")}" placeholder="Prix total HTVA (TND)"><input class="bn" value="${esc(b.billing_name)}" placeholder="Nom sur la facture"><input class="ba2" value="${esc(b.billing_address)}" placeholder="Adresse de facturation"><input class="bt" value="${esc(b.billing_tax_id)}" placeholder="Matricule fiscal"><button class="bsave">Enregistrer</button></div></details>
    </div>`}).join(""):`<div class="card">Aucune réservation.</div>`;
  $("bl").querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.id,b=BK.find(x=>x.id===id);
    card.querySelectorAll("[data-a]").forEach(btn=>btn.onclick=()=>act(b,btn.dataset.a));
    card.querySelector("[data-dos]").onclick=()=>openDossier(b);
    const iv=card.querySelector("[data-inv]");
    if(iv)iv.onclick=async()=>{
      if(!confirm("Émettre la facture ? Une fois émise, elle ne pourra être corrigée que par un avoir."))return;
      iv.disabled=true;const {data:d,error:e}=await sb.rpc("issue_invoice",{p_booking:id});iv.disabled=false;
      if(e)return fail(e);await loadF();notify("Facture émise ✓");if(d?.id)openInvoice(d.id);
    };
    card.querySelector(".bsave").onclick=async ev=>{
      const btn=ev.target,pr=card.querySelector(".bp").value;btn.disabled=true;let e1=null;
      if(pr!=="")e1=(await sb.rpc("set_booking_price",{p_booking:id,p_subtotal:+pr})).error;
      const e2=(await sb.rpc("set_billing",{p_booking:id,p_phone:"",p_name:card.querySelector(".bn").value,p_address:card.querySelector(".ba2").value,p_tax:card.querySelector(".bt").value})).error;
      btn.disabled=false;if(e1||e2)return fail(e1||e2);
      notify("Facturation enregistrée ✓");await loadB();computeAccounting();
    };
  });
}
async function act(b,status){
  let m=status==="confirmed"?"Confirmer cette réservation ?":"Annuler cette réservation ?";
  if(status==="confirmed"&&verifiedOf(b.id)<=0)m="⚠ Aucun paiement vérifié pour cette réservation.\nConfirmer quand même ?";
  if(!confirm(m))return;
  const upd={status,updated_at:new Date().toISOString()};if(status==="confirmed")upd.hold_expires_at=null;
  const {error}=await sb.from("bookings").update(upd).eq("id",b.id);
  if(error)return fail(error);await loadB();computeAccounting();notify(status==="confirmed"?"Réservation confirmée ✓":"Réservation annulée");
}

    <input class="pr" type="number" min="0" step="0.5" value="${esc(v.daily_price_htva??"")}" placeholder="Prix HTVA"><input class="pl" value="${esc(v.plate)}" placeholder="Plaque">

    <div style="grid-column:1/-1"><div class="row" style="justify-content:flex-start"><input type="file" class="up" accept="image/jpeg,image/png,image/webp" style="width:auto"><button class="up-b">Ajouter la photo</button></div>
    <div class="ph-list">${(imgs||[]).filter(i=>i.vehicle_id===v.id).map(i=>`<span class="ph"><img src="${IMG}${esc(i.path)}" alt="${esc(v.name)}" loading="lazy"><button data-del="${esc(i.id)}" data-path="${esc(i.path)}" title="Supprimer">×</button></span>`).join("")}</div></div></div>`).join("")+`</div>`;
  $("tv").querySelectorAll(".sv").forEach(btn=>btn.onclick=async()=>{

    btn.disabled=true;const {error:e}=await sb.from("vehicles").update({daily_price_htva:pr===""?null:+pr,plate:r.querySelector(".pl").value.trim()||null,status:r.querySelector(".sx").value}).eq("id",r.dataset.id);
    btn.disabled=false;e?fail(e):notify("Véhicule mis à jour ✓");
  });
  $("tv").querySelectorAll(".up-b").forEach(btn=>btn.onclick=async()=>{
    const r=btn.closest(".vrow"),f=r.querySelector(".up").files[0];
    const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[f?.type];
    if(!f)return fail("Choisissez d'abord une photo.");if(!ext||f.size>5*1048576)return fail("Format non accepté (JPG, PNG, WebP, 5 Mo max).");
    btn.disabled=true;const path=`${r.dataset.id}/${Date.now()}.${ext}`;
    const up=await sb.storage.from("vehicle-images").upload(path,f,{contentType:f.type});
    if(up.error){btn.disabled=false;return fail(up.error)}
    const ins=await sb.from("vehicle_images").insert({vehicle_id:r.dataset.id,path,alt:r.querySelector("b").textContent});

  });
}

  $("tp").querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{
    const st=b.dataset.s,amt=+($("am"+b.dataset.v).value||0);
    if(st==="verified"&&!(amt>0))return fail("Saisissez le montant réellement reçu.");
    if(st==="rejected"&&!confirm("Rejeter cette preuve ?"))return;
    b.disabled=true;const u=(await sb.auth.getUser()).data.user.id;
    const {error}=await sb.from("payments").update({status:st,amount:st==="verified"?amt:0,verified_by:u,verified_at:new Date().toISOString()}).eq("id",b.dataset.v);
    if(error){b.disabled=false;return fail(error)}
    await loadP();await loadB();computeAccounting();notify("Paiement mis à jour ✓");
  });
}

async function loadF(){
  const {data,error}=await sb.from("invoices").select("*").order("issued_at",{ascending:false}).limit(500);
  if(error){$("tf").innerHTML=`<div class="msg">${esc(error.message)}</div>`;return}
  INV=data||[];$("stInvoices").textContent=INV.length;
  const credited=new Set(INV.filter(i=>i.corrects).map(i=>i.corrects));
  $("tf").innerHTML=`<div class="card"><div class="row"><h3 style="font-size:24px">Factures et avoirs</h3><button id="csv">Exporter CSV (comptable)</button></div>
  ${INV.map(i=>`<div class="row" style="border-top:1px solid var(--line);padding:9px 0"><div><b>${esc(i.number)}</b> · ${i.kind==="credit_note"?"Avoir":"Facture"} · ${fmt(i.issued_at)}<br><span class="small">${esc(i.snapshot?.customer?.name||"")} · <span class="mono">${money(i.snapshot?.total_ttc)}</span> TND TTC${credited.has(i.id)?" · ⚠ annulée":""}</span></div>
  <div style="display:flex;gap:6px"><button data-o="${esc(i.id)}">Ouvrir</button>${i.kind==="invoice"&&!credited.has(i.id)?`<button class="r" data-cn="${esc(i.id)}">Créer un avoir</button>`:""}</div></div>`).join("")||"<p class='small'>Aucune facture.</p>"}</div>`;
  $("tf").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>openInvoice(b.dataset.o));
  $("tf").querySelectorAll("[data-cn]").forEach(b=>b.onclick=async()=>{
    const why=prompt("Motif de l'avoir (obligatoire) :");if(!why)return;
    const {data:r,error:e}=await sb.rpc("issue_credit_note",{p_invoice:b.dataset.cn,p_reason:why});
    if(e)return fail(e);await loadF();notify("Avoir créé ✓");if(r?.id)openInvoice(r.id);
  });
  $("csv").onclick=()=>{
    const rows=[["Numero","Type","Date","Client","Vehicule","HTVA","TVA","TTC"]];
    INV.forEach(i=>{const s=i.snapshot||{},o=s.original||s;rows.push([i.number,i.kind,String(i.issued_at||"").slice(0,10),s.customer?.name,o.vehicle?.name,s.subtotal_htva,s.vat_amount,s.total_ttc])});
    download("factures.csv",rows);
  };
}

const SL={vat_rate:"TVA (%)",deposit_enabled:"Acompte activé",deposit_pct:"Acompte (%)",hold_minutes:"Durée de retenue (minutes)",min_days:"Durée minimale (jours)",levy_per_day:"Taxe par jour (TND)",fiscal_stamp_enabled:"Timbre fiscal actif",fiscal_stamp_amount:"Montant timbre (TND)",company_name:"Société : nom",company_address:"Société : adresse",company_tax_id:"Société : matricule fiscal",company_phone:"Société : téléphone",company_email:"Société : e-mail",invoice_footer:"Pied de facture",whatsapp:"WhatsApp"};
const NUM=new Set(["vat_rate","deposit_pct","hold_minutes","min_days","levy_per_day","fiscal_stamp_amount"]);
async function loadS(){
  const {data,error}=await sb.from("settings").select("*").order("key");
  if(error){$("ts").innerHTML=`<div class="msg">${esc(error.message)}</div>`;return}
  const rows=data||[];SET={};rows.forEach(r=>SET[r.key]=r.value);
  $("ts").innerHTML=`<div class="card"><h3 style="margin-bottom:6px;font-size:24px">Paramètres généraux</h3>${rows.map(r=>{
    const bool=/_enabled$/.test(r.key),v=String(r.value??"").toLowerCase();
    return `<div style="margin:10px 0"><label class="small">${esc(SL[r.key]||r.key)}</label>${bool?`<select data-k="${esc(r.key)}"><option value="true"${v==="true"?" selected":""}>Oui</option><option value="false"${v!=="true"?" selected":""}>Non</option></select>`:`<input data-k="${esc(r.key)}" value="${esc(r.value)}"${NUM.has(r.key)?' inputmode="decimal"':""}>`}</div>`}).join("")}
  <button class="g" id="ssave">Enregistrer les paramètres</button></div>`;
  $("ssave").onclick=async()=>{
    const els=[...$("ts").querySelectorAll("[data-k]")];
    for(const i of els){if(NUM.has(i.dataset.k)&&(i.value.trim()===""||isNaN(+i.value.replace(",","."))))return fail("Valeur numérique invalide : "+(SL[i.dataset.k]||i.dataset.k))}
    const up=els.map(i=>({key:i.dataset.k,value:NUM.has(i.dataset.k)?i.value.trim().replace(",","."):i.value.trim(),updated_at:new Date().toISOString()}));
    const {error:e}=await sb.from("settings").upsert(up);if(e)return fail(e);
    await loadS();computeAccounting();renderB&&$("bl")&&renderB();notify("Paramètres enregistrés ✓");
  };
}
boot();
</script>
