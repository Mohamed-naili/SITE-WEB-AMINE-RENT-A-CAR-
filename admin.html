<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin | Amine Rent A Car</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Work+Sans:wght@400;500;600;700&family=Cairo:wght@500;700;800&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    :root {
      --ink: #15181c;
      --ink-2: #22272e;
      --paper: #f1f2f0;
      --surface: #ffffff;
      --sand: #e7e5de;
      --red: #d62828;
      --red-dark: #a61c1c;
      --green: #1f9d57;
      --green-dark: #167a42;
      --gold: #c9a227;
      --line: #d9dad6;
      --line-strong: #c2c4be;
      --muted: #5d6268;
      --text: #1f2226;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(21, 24, 28, 0.06);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Work Sans", "Cairo", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.48;
      background: var(--paper);
      color: var(--text);
    }

    h1,
    h2,
    h3 {
      font-family: "Barlow Condensed", "Cairo", sans-serif;
      font-weight: 800;
      line-height: 1.1;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(90deg, var(--ink), var(--ink-2));
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 3px solid var(--red);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: "Work Sans", sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(31, 157, 87, 0.2);
      color: #8ef0b8;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #36d47a;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.2s var(--ease), border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--line-strong);
    }

    input,
    select {
      padding: 9px 11px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      width: 100%;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.2);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      background: var(--ink);
      cursor: pointer;
      transition: transform 0.16s var(--ease), background-color 0.18s ease, opacity 0.18s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--ink-2);
    }

    button:active:not(:disabled) {
      transform: translateY(0) scale(0.985);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .g {
      background: var(--green);
    }

    .g:hover:not(:disabled) {
      background: var(--green-dark);
    }

    .r {
      background: var(--red);
    }

    .r:hover:not(:disabled) {
      background: var(--red-dark);
    }

    .gold-btn {
      background: var(--gold);
      color: #14171a;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }

    .stat-box small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-box strong {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 28px;
      color: var(--ink);
    }

    .alert-item {
      border: 1px solid var(--line);
      border-inline-start: 4px solid var(--red);
      border-radius: 10px;
      padding: 11px 13px;
      background: #fafbf9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .alert-badge {
      background: var(--red);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 999px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tabs button {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .tabs button.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .st {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      color: #fff;
    }

    .pending {
      background: var(--gold);
      color: #14171a;
    }

    .confirmed {
      background: var(--green);
    }

    .cancelled,
    .expired {
      background: #7c8288;
    }

    .cancellation_requested {
      background: #e67e22;
    }

    .blocked {
      background: #4b5056;
    }

    .msg {
      color: var(--red);
      font-weight: 700;
      margin: 8px 0;
    }

    .ok-msg {
      color: var(--green-dark);
      font-weight: 700;
      font-size: 13px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
    }

    .ph-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .ph {
      display: inline-block;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      background: var(--paper);
    }

    .ph img {
      height: 62px;
      width: 92px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .ph button {
      position: absolute;
      top: -6px;
      inset-inline-end: -6px;
      padding: 0 6px;
      height: 20px;
      line-height: 20px;
      border-radius: 50%;
      background: var(--red);
      font-size: 12px;
    }

    .vrow {
      display: grid;
      grid-template-columns: 1.4fr 115px 130px auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .ev-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto;
      gap: 8px;
      align-items: end;
      margin-top: 10px;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      inset-inline-end: 18px;
      z-index: 90;
      background: var(--ink);
      color: #fff;
      border-inline-start: 4px solid var(--green);
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 18, 22, 0.68);
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .sheet {
      background: #fff;
      border-radius: 14px;
      max-width: 780px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .inv-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 3px solid var(--red);
      padding-bottom: 12px;
    }

    .inv-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 14px 0;
    }

    .inv-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .inv-tbl {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .inv-tbl th {
      background: var(--paper);
      text-align: left;
      font-size: 12px;
      padding: 8px;
      border-bottom: 1px solid var(--line);
    }

    .inv-tbl td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
    }

    .inv-tbl td.r,
    .inv-tbl th.r {
      text-align: right;
      white-space: nowrap;
    }

    .inv-tot {
      width: 65%;
      margin-left: auto;
      margin-top: 8px;
    }

    .inv-tot td {
      padding: 4px 8px;
    }

    .inv-tot .g td {
      font-size: 16px;
      font-weight: 800;
      border-top: 2px solid var(--ink);
      padding-top: 8px;
    }

    @media (max-width: 900px) {
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      .ev-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .vrow,
      .inv-head,
      .inv-two {
        grid-template-columns: 1fr;
      }
      .stats-bar,
      .ev-grid {
        grid-template-columns: 1fr;
      }
      .inv-tot {
        width: 100%;
      }
    }

    @media print {
      header,
      main,
      .toast,
      .np {
        display: none !important;
      }
      .modal {
        position: static;
        background: none;
        padding: 0;
      }
      .sheet {
        box-shadow: none;
        max-width: none;
        max-height: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <span>AMINE RENT A CAR : ADMIN</span>
      <span class="live-pill"><span class="live-dot"></span>DIRECT SYNC</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <button type="button" id="refreshAll" class="g" hidden>Actualiser</button>
      <button type="button" id="out" hidden>Déconnexion</button>
    </div>
  </header>

  <main>
    <div class="card" id="login" style="max-width: 400px; margin: 40px auto">
      <h2 style="margin-bottom: 12px; font-size: 28px">Connexion Admin</h2>
      <p style="margin-bottom: 10px">
        <input id="em" type="email" placeholder="E-mail" autocomplete="username" />
      </p>
      <p style="margin-bottom: 12px">
        <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" />
      </p>
      <button type="button" id="go" style="width: 100%">Se connecter</button>
      <div class="msg" id="lm"></div>
    </div>

    <div id="app" hidden>
      <div class="stats-bar" id="statsBar">
        <div class="stat-box"><small>Alertes non lues</small><strong id="stAlerts">0</strong></div>
        <div class="stat-box"><small>Réservations</small><strong id="stBookings">0</strong></div>
        <div class="stat-box"><small>En attente</small><strong id="stPending">0</strong></div>
        <div class="stat-box"><small>Véhicules</small><strong id="stVehicles">0</strong></div>
        <div class="stat-box"><small>Factures</small><strong id="stInvoices">0</strong></div>
      </div>

      <div class="card" id="alertsCard">
        <div class="row" style="margin-bottom: 10px">
          <div style="display: flex; align-items: center; gap: 8px">
            <h3 style="font-size: 22px">Notifications Clients (Nouvelles réservations & dossiers)</h3>
            <span class="alert-badge" id="alertsBadge">0</span>
          </div>
          <button type="button" id="refreshAlertsBtn">Actualiser alertes</button>
        </div>
        <div id="alertsList" style="display: grid; gap: 8px">
          <p class="small">Chargement des notifications...</p>
        </div>
      </div>

      <div class="tabs">
        <button class="on" data-t="b">Réservations</button>
        <button data-t="v">Véhicules & prix</button>
        <button data-t="e">Fêtes & vacances</button>
        <button data-t="p">Paiements & banque</button>
        <button data-t="f">Factures</button>
        <button data-t="s">Paramètres</button>
      </div>

      <div id="tb"></div>
      <div id="tv" hidden></div>
      <div id="te" hidden></div>
      <div id="tp" hidden></div>
      <div id="tf" hidden></div>
      <div id="ts" hidden></div>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>

  <div class="modal" id="invModal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="row np" style="margin-bottom: 12px">
        <button type="button" class="g" id="invPrintBtn">Imprimer / PDF</button>
        <button type="button" id="invCloseBtn">Fermer</button>
      </div>
      <div id="invModalBody"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://tadaqaqvtjcnanspcboj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fA2Est6rYrP6Sx1xfyhdOA_IA5TQ6MO";
    const IMG_PUBLIC_BASE = `${SUPABASE_URL}/storage/v1/object/public/vehicle-images/`;

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.SB = sb;

    const $ = (id) => document.getElementById(id);
    const esc = (s) =>
      String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    const fmt = (d) => new Date(d).toLocaleDateString("fr-FR", { timeZone: "Africa/Tunis" });
    const money = (n) =>
      Number(n ?? 0).toLocaleString("fr-FR", { minimumFractionDigits: 3, maximumFractionDigits: 3 });

    const LAB = {
      pending: "En attente",
      confirmed: "Confirmée",
      cancelled: "Annulée",
      expired: "Expirée",
      cancellation_requested: "Annulation demandée",
      blocked: "Bloquée"
    };

    let toastTimer = null;
    function notify(text) {
      const t = $("toast");
      if (!t) return;
      t.textContent = text;
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.hidden = true;
      }, 2400);
    }

    let alertsChannel = null;
    function subscribeAlerts() {
      if (alertsChannel || typeof sb.channel !== "function") return;
      alertsChannel = sb
        .channel("admin_notifications_realtime")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "admin_notifications" },
          async (payload) => {
            await loadAlerts();
            await loadB();
            const title = payload?.new?.title || "Nouvelle notification client";
            notify("🔔 " + title);
          }
        )
        .subscribe();
    }

    async function loadAlerts() {
      const { data, error } = await sb
        .from("admin_notifications")
        .select("*")
        .eq("is_read", false)
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) {
        $("alertsList").innerHTML = `<p class="small">Notifications : ${esc(error.message)}</p>`;
        return;
      }

      const items = data || [];
      $("stAlerts").textContent = String(items.length);
      $("alertsBadge").textContent = String(items.length);

      if (!items.length) {
        $("alertsList").innerHTML = `<p class="small">Aucune nouvelle alerte non lue.</p>`;
        return;
      }

      $("alertsList").innerHTML = items
        .map((n) => {
          const p = n.payload || {};
          const when = n.created_at
            ? new Date(n.created_at).toLocaleString("fr-FR", { timeZone: "Africa/Tunis" })
            : "";
          const meta = [
            n.client_phone ? `Tél: ${esc(n.client_phone)}` : "",
            p.pickup_text ? `Agence: ${esc(p.pickup_text)}` : "",
            p.license_number ? `Permis: ${esc(p.license_number)}` : "",
            when ? esc(when) : ""
          ]
            .filter(Boolean)
            .join(" · ");

          return `<div class="alert-item">
            <div>
              <b>${esc(n.title)}</b> — <span>${esc(n.client_name || "Client")}</span>
              <div class="small">${meta}</div>
            </div>
            <button type="button" class="g" data-mark-read="${esc(n.id)}">Marquer lu</button>
          </div>`;
        })
        .join("");

      $("alertsList").querySelectorAll("[data-mark-read]").forEach((btn) => {
        btn.onclick = async () => {
          btn.disabled = true;
          const { error: uErr } = await sb
            .from("admin_notifications")
            .update({ is_read: true })
            .eq("id", btn.dataset.markRead);
          if (!uErr) {
            await loadAlerts();
            notify("Notification marquée comme lue ✓");
          } else {
            btn.disabled = false;
            alert(uErr.message);
          }
        };
      });
    }

    $("refreshAlertsBtn").onclick = async () => {
      await loadAlerts();
      notify("Notifications actualisées ✓");
    };

    async function openInvoicePreview(invId) {
      $("invModalBody").innerHTML = `<p class="small">Chargement de la facture...</p>`;
      $("invModal").hidden = false;
      const { data: inv, error } = await sb
        .from("invoices")
        .select("*")
        .eq("id", invId)
        .maybeSingle();

      if (error || !inv || !inv.snapshot) {
        $("invModalBody").innerHTML = `<div class="msg">Facture introuvable : ${esc(
          error?.message || ""
        )}</div>`;
        return;
      }

      const s = inv.snapshot,
        c = s.company || {},
        cu = s.customer || {},
        isCN = inv.kind === "credit_note",
        ov = isCN ? s.original?.vehicle || {} : s.vehicle || {};

      const lines = isCN
        ? `<tr><td>Avoir annulant la facture ${esc(s.original_number)}</td><td class="r">${money(
            s.total_ttc
          )} TND</td></tr>`
        : `<tr><td>Location ${esc(ov.name)}${
            ov.plate ? ` (${esc(ov.plate)})` : ""
          }<div class="small">du ${fmt(s.start_date)} au ${fmt(s.end_date)} : ${esc(
            s.days
          )} jour(s) × ${money(s.daily_htva)} TND HTVA</div></td><td class="r">${money(
            s.subtotal_htva
          )} TND</td></tr>
           <tr><td>Taxe de location (${money(s.levy_per_day)} × ${esc(
            s.days
          )} jour(s))</td><td class="r">${money(s.levy_total)} TND</td></tr>`;

      const totals = isCN
        ? `<tr class="g"><td>Total TTC de l'avoir</td><td class="r">${money(s.total_ttc)} TND</td></tr>`
        : `<tr><td>Sous-total HTVA</td><td class="r">${money(s.subtotal_htva)} TND</td></tr>
           <tr><td>TVA (${esc(s.vat_rate)} %)</td><td class="r">${money(s.vat_amount)} TND</td></tr>
           <tr><td>Taxe de location</td><td class="r">${money(s.levy_total)} TND</td></tr>
           ${
             +s.fiscal_stamp > 0
               ? `<tr><td>Timbre fiscal</td><td class="r">${money(s.fiscal_stamp)} TND</td></tr>`
               : ""
           }
           <tr class="g"><td>Total TTC</td><td class="r">${money(s.total_ttc)} TND</td></tr>
           <tr><td>Acompte versé</td><td class="r">${money(s.deposit_paid)} TND</td></tr>
           <tr><td><b>Reste à payer</b></td><td class="r"><b>${money(s.balance_due)} TND</b></td></tr>`;

      $("invModalBody").innerHTML = `
        <div class="inv-head">
          <div>
            <h2>${isCN ? "AVOIR" : "FACTURE"}</h2>
            <div><b>N° ${esc(inv.number)}</b></div>
            <div class="small">Émise le ${fmt(inv.issued_at)}</div>
          </div>
          <div style="text-align:center">
            <canvas id="adminInvQr" width="92" height="92"></canvas>
            <div class="small" style="font-size:10px">QR Vérification</div>
          </div>
          <div style="text-align:right">
            <b>${esc(c.name || "AMINE RENT A CAR")}</b>
            <div class="small">${esc(c.address || "")}<br>MF : ${esc(
        c.tax_id || ""
      )}<br>${esc(c.phone || "")} ${esc(c.email || "")}</div>
          </div>
        </div>
        <div class="inv-two">
          <div class="inv-box">
            <div class="small" style="font-weight:700">CLIENT</div>
            <b>${esc(cu.name || "")}</b>
            <div class="small">${esc(cu.address || "")}${
        cu.tax_id ? `<br>MF : ${esc(cu.tax_id)}` : ""
      }<br>${esc(cu.phone || "")}</div>
          </div>
          <div class="inv-box">
            <div class="small" style="font-weight:700">${isCN ? "MOTIF" : "PAIEMENT"}</div>

    async function boot() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        $("login").hidden = false;
        $("app").hidden = true;
        $("out").hidden = true;
        $("refreshAll").hidden = true;
        return;
      }

      const { data: p, error: pe } = await sb
        .from("profiles")
        .select("role")
        .eq("id", session.user.id)
        .maybeSingle();

      if (!p || !["admin", "staff"].includes(p.role)) {
        const why = pe
          ? "Erreur base de données : " + pe.message
          : !p
          ? "aucun profil trouvé pour ce compte (relancer la commande SQL d'attribution après la création du compte)"
          : "rôle actuel : " + p.role;
        await sb.auth.signOut();
        boot();
        $("lm").textContent = "Connexion réussie, mais ce compte n'est pas administrateur : " + why;
        return;
      }

      $("login").hidden = true;
      $("app").hidden = false;
      $("out").hidden = false;
      $("refreshAll").hidden = false;

      try {
        await sb.rpc("expire_holds");
      } catch (e) {}

      subscribeAlerts();
      await Promise.all([loadAlerts(), loadB(), loadV(), loadE(), loadP(), loadF(), loadS()]);
    }

    $("go").onclick = async () => {
      $("lm").textContent = "";
      const { error } = await sb.auth.signInWithPassword({
        email: $("em").value.trim(),
        password: $("pw").value
      });
      if (error) {
        $("lm").textContent =
          "Connexion refusée : " + error.message + (error.status ? " (code " + error.status + ")" : "");
        return;
      }
      $("pw").value = "";
      boot();
    };

    $("out").onclick = async () => {
      await sb.auth.signOut();
      boot();
    };

    $("refreshAll").onclick = async () => {
      notify("Mise à jour en direct...");
      await Promise.all([loadAlerts(), loadB(), loadV(), loadE(), loadP(), loadF(), loadS()]);
      notify("Données synchronisées ✓");
    };

    document.querySelectorAll(".tabs button").forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
        $("tb").hidden = b.dataset.t !== "b";
        $("tv").hidden = b.dataset.t !== "v";
        $("te").hidden = b.dataset.t !== "e";
        $("tp").hidden = b.dataset.t !== "p";
        $("tf").hidden = b.dataset.t !== "f";
        $("ts").hidden = b.dataset.t !== "s";
      };
    });

    /* =========================================================================
       1. RÉSERVATIONS
       ========================================================================= */
    async function loadB() {
      const { data, error } = await sb
        .from("bookings")
        .select("*,vehicles(name)")
        .order("created_at", { ascending: false })
        .limit(100);

      if (error) {
        $("tb").innerHTML = `<div class="msg">${esc(error.message)}</div>`;
        return;
      }

      const list = data || [];
      $("stBookings").textContent = String(list.length);
      $("stPending").textContent = String(list.filter((x) => x.status === "pending").length);

      $("tb").innerHTML = list.length
        ? list
            .map(
              (b) => `<div class="card">
                <div class="row">
                  <b>${esc(b.vehicles?.name)}</b>
                  <span class="st ${b.status}">${LAB[b.status] || esc(b.status)}</span>
                </div>
                <div>${esc(b.guest_name)} · <a href="tel:${esc(b.guest_phone)}">${esc(b.guest_phone)}</a></div>
                <div class="small">Du ${fmt(b.start_at)} au ${fmt(b.end_at)} · ${esc(b.quote?.days)} jours · ${esc(
                  b.pickup_text
                )}${b.quote?.subtotal_htva ? ` · ~${esc(b.quote.subtotal_htva)} TND HTVA` : ""}</div>
                ${
                  b.status === "pending" && b.hold_expires_at
                    ? `<div class="small">Réservation retenue jusqu'à ${new Date(
                        b.hold_expires_at
                      ).toLocaleTimeString("fr-FR", {
                        timeZone: "Africa/Tunis",
                        hour: "2-digit",
                        minute: "2-digit"
                      })}</div>`
                    : ""
                }
                <div class="row" style="margin-top: 8px; justify-content: flex-start">
                  ${
                    ["pending", "cancellation_requested"].includes(b.status)
                      ? `<button class="g" data-a="confirmed" data-id="${b.id}">Confirmer</button>`
                      : ""
                  }
                  ${
                    ["pending", "confirmed", "cancellation_requested"].includes(b.status)
                      ? `<button class="r" data-a="cancelled" data-id="${b.id}">Annuler</button>`
                      : ""
                  }
                  ${
                    b.status === "confirmed"
                      ? `<button class="g" data-inv="${b.id}">Créer la facture</button>`
                      : ""
                  }
                </div>
                <details style="margin-top: 8px">
                  <summary class="small" style="cursor: pointer">Prix HTVA et infos de facturation</summary>
                  <div style="display: grid; gap: 6px; margin-top: 6px" data-bk="${b.id}">
                    <input class="bp" type="number" min="0" step="0.5" value="${esc(
                      b.quote?.subtotal_htva ?? ""
                    )}" placeholder="Prix total HTVA (TND)" />
                    <input class="bn" value="${esc(
                      b.billing_name
                    )}" placeholder="Nom sur la facture (vide = nom du client)" />
                    <input class="ba2" value="${esc(
                      b.billing_address
                    )}" placeholder="Adresse de facturation" />
                    <input class="bt" value="${esc(
                      b.billing_tax_id
                    )}" placeholder="Matricule fiscal (si entreprise)" />
                    <button class="bsave">Enregistrer</button>
                  </div>
                </details>
              </div>`
            )
            .join("")
        : `<div class="card">Aucune demande pour le moment.</div>`;

      $("tb").querySelectorAll("[data-a]").forEach((btn) => {
        btn.onclick = () => act(btn.dataset.id, btn.dataset.a);
      });

      $("tb").querySelectorAll(".bsave").forEach((btn) => {
        btn.onclick = async () => {
          const w = btn.closest("[data-bk]");
          const id = w.dataset.bk;
          const pr = w.querySelector(".bp").value;
          btn.disabled = true;
          let e1 = null;
          if (pr !== "") {
            e1 = (await sb.rpc("set_booking_price", { p_booking: id, p_subtotal: +pr })).error;
          }
          const e2 = (
            await sb.rpc("set_billing", {
              p_booking: id,
              p_phone: "",
              p_name: w.querySelector(".bn").value,
              p_address: w.querySelector(".ba2").value,
              p_tax: w.querySelector(".bt").value
            })
          ).error;
          const er = e1 || e2;
          btn.disabled = false;
          btn.textContent = er ? "Erreur" : "Enregistré ✓";
          if (er) alert(er.message);
          else notify("Facturation enregistrée ✓");
          setTimeout(() => {
            btn.textContent = "Enregistrer";
          }, 1600);
        };
      });

      $("tb").querySelectorAll("[data-inv]").forEach((btn) => {
        btn.onclick = async () => {
          if (
            !confirm(
              "Émettre la facture ? Une fois émise elle ne pourra plus être modifiée (seulement corrigée par un avoir)."
            )
          )
            return;
          const { data: invData, error: invErr } = await sb.rpc("issue_invoice", {
            p_booking: btn.dataset.inv
          });
          if (invErr) return alert(invErr.message);
          await loadF();
          notify("Facture émise ✓");
          if (invData?.id) await openInvoicePreview(invData.id);
        };
      });
    }

    async function act(id, status) {
      if (
        !confirm(
          status === "confirmed"
            ? "Confirmer cette réservation (après vérification du paiement) ?"
            : "Annuler cette réservation ?"
        )
      )
        return;
      const upd = { status, updated_at: new Date().toISOString() };
      if (status === "confirmed") upd.hold_expires_at = null;
      const { error } = await sb.from("bookings").update(upd).eq("id", id);
      if (error) {
        alert("Impossible : " + error.message);
        return;
      }
      try {
        const actor = (await sb.auth.getUser()).data.user.id;
        await sb.from("audit_log").insert({
          actor,
          action: "booking_" + status,
          entity: "booking",
          entity_id: id
        });
      } catch (e) {}
      await loadB();
      notify(status === "confirmed" ? "Réservation confirmée ✓" : "Réservation annulée");
    }

    /* =========================================================================
       2. VÉHICULES, PRIX EN DIRECT & PHOTOS
       ========================================================================= */
    async function loadV() {

        $("tv").innerHTML = `<div class="msg">${esc(error.message)}</div>`;

      $("tv").innerHTML =
        `<div class="card">
          <p class="small">
            Modification immédiate sur le site : changez le prix journalier HTVA (TND), le statut, ou ajoutez/supprimez des photos directement. Pour les VIP, laissez vide = "prix sur demande".
          </p>` +
        vehicles
          .map(
            (v) => `<div class="vrow" data-id="${v.id}">
              <div>
                <b>${esc(v.name)}</b>
                <span class="small">${esc(String(v.category || "").toUpperCase())}</span>

              }" placeholder="Prix HTVA" />

                <select class="sx">
                  <option value="active"${v.status === "active" ? " selected" : ""}>Actif</option>
                  <option value="disabled"${v.status === "disabled" ? " selected" : ""}>Désactivé</option>
                  <option value="archived"${v.status === "archived" ? " selected" : ""}>Archivé</option>
                </select>
                <button class="g sv" style="margin-top: 6px; width: 100%">Enregistrer</button>
              </div>
              <div style="grid-column: 1 / -1">
                <div class="row" style="justify-content: flex-start">
                  <input type="file" class="up" accept="image/jpeg,image/png,image/webp" style="width: auto" />
                  <button class="up-b" type="button">Ajouter la photo</button>
                  <span class="small">JPG / PNG / WebP · 3 Mo max · Direct sur le site</span>
                </div>
                <div class="ph-list">
                  ${(imgs || [])
                    .filter((i) => i.vehicle_id === v.id)
                    .map(
                      (i) => `<span class="ph">
                        <img src="${IMG_PUBLIC_BASE}${esc(i.path)}" alt="${esc(v.name)}" loading="lazy" />
                        <button type="button" data-del="${i.id}" data-path="${esc(
                          i.path
                        )}" title="Supprimer">×</button>
                      </span>`
                    )
                    .join("")}
                </div>
              </div>
            </div>`
          )
          .join("") +
        `</div>`;

      $("tv").querySelectorAll(".sv").forEach((btn) => {
        btn.onclick = async () => {
          const r = btn.closest(".vrow");
          const pr = r.querySelector(".pr").value;
          btn.disabled = true;
          const { error: upErr } = await sb
            .from("vehicles")
            .update({
              daily_price_htva: pr === "" ? null : +pr,
              plate: r.querySelector(".pl").value.trim() || null,
              status: r.querySelector(".sx").value
            })
            .eq("id", r.dataset.id);
          btn.disabled = false;
          btn.textContent = upErr ? "Erreur" : "Enregistré ✓";
          if (upErr) alert(upErr.message);
          else notify("Prix et véhicule mis à jour en direct ✓");
          setTimeout(() => {
            btn.textContent = "Enregistrer";
          }, 1600);
        };
      });

      $("tv").querySelectorAll(".up-b").forEach((btn) => {
        btn.onclick = async () => {
          const r = btn.closest(".vrow");
          const f = r.querySelector(".up").files[0];
          if (!f) return alert("Choisissez d'abord une photo.");
          const ext = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" }[f.type];
          if (!ext) return alert("Format non accepté (JPG, PNG ou WebP).");
          if (f.size > 3 * 1024 * 1024) return alert("Photo trop lourde (3 Mo max).");

          btn.disabled = true;
          btn.textContent = "Envoi...";
          const path = `${r.dataset.id}/${Date.now()}.${ext}`;
          const up = await sb.storage.from("vehicle-images").upload(path, f, { contentType: f.type });
          if (up.error) {
            alert("Échec : " + up.error.message);
            btn.disabled = false;
            btn.textContent = "Ajouter la photo";

            vehicle_id: r.dataset.id,

            alt: r.querySelector("b").textContent
          });

          await loadV();
          notify("Photo ajoutée et visible sur le site ✓");
        };
      });

      $("tv").querySelectorAll("[data-del]").forEach((b) => {
        b.onclick = async () => {
          if (!confirm("Supprimer cette photo ?")) return;
          await sb.storage.from("vehicle-images").remove([b.dataset.path]);
          await sb.from("vehicle_images").delete().eq("id", b.dataset.del);
          await loadV();
          notify("Photo supprimée ✓");
        };
      });
    }

                        <div>

    /* =========================================================================
       4. PAIEMENTS & BANQUE
       ========================================================================= */
    async function loadP() {
      const [ba, pay] = await Promise.all([
        sb.from("bank_accounts").select("*").order("sort"),
        sb
          .from("payments")
          .select("*,bookings(guest_name,guest_phone,quote,vehicles(name))")
          .order("created_at", { ascending: false })
          .limit(50)
      ]);
      const PL = {
        awaiting: "En attente",
        proof_uploaded: "Preuve reçue (à vérifier)",
        verified: "Vérifié",
        rejected: "Rejeté"
      };

      $("tp").innerHTML = `<div class="card">
        <h3 style="margin-bottom: 6px; font-size: 24px">Comptes bancaires affichés aux clients</h3>
        <p class="small">Saisissez ici le RIB officiel. Il reste dans la base de données (jamais dans le code public).</p>
        ${(ba.data || [])
          .map(
            (a) => `<div class="row" style="border-top: 1px solid var(--line); padding: 8px 0">
              <div><b>${esc(a.bank)}</b> · ${esc(a.holder)}<br><code>${esc(a.rib)}</code></div>
              <button class="r" data-bd="${a.id}">Supprimer</button>
            </div>`
          )
          .join("")}
        <div class="vrow" style="grid-template-columns: 1fr 1fr 1.4fr auto">
          <input id="bk" placeholder="Banque (UIB...)" />
          <input id="bh" placeholder="Titulaire" />
          <input id="br" placeholder="RIB" />
          <button class="g" id="ba">Ajouter</button>
        </div>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 6px; font-size: 24px">Paiements</h3>
        <p class="small">Vérifiez le virement sur votre compte, puis saisissez le montant réellement reçu.</p>
        ${
          (pay.data || [])
            .map(
              (p) => `<div style="border-top: 1px solid var(--line); padding: 10px 0">
                <div class="row">
                  <b>${esc(p.bookings?.vehicles?.name)} · ${esc(p.bookings?.guest_name)}</b>
                  <span class="st ${
                    p.status === "verified" ? "confirmed" : p.status === "rejected" ? "cancelled" : "pending"
                  }">${PL[p.status] || esc(p.status)}</span>
                </div>
                <div class="small">${esc(p.bookings?.guest_phone)} · reçu : ${esc(p.amount)} TND</div>
                <div class="row" style="justify-content: flex-start; margin-top: 6px">
                  ${p.proof_path ? `<button data-pf="${esc(p.proof_path)}">Voir la preuve</button>` : ""}
                  ${
                    p.status === "proof_uploaded"
                      ? `<input type="number" min="0" step="0.5" placeholder="Montant reçu" style="width: 130px" id="am${p.id}" />
                         <button class="g" data-v="${p.id}" data-s="verified">Vérifié</button>
                         <button class="r" data-v="${p.id}" data-s="rejected">Rejeter</button>`
                      : ""
                  }
                </div>
              </div>`
            )
            .join("") || "<p class='small'>Aucun paiement pour le moment.</p>"
        }
      </div>`;

      $("ba").onclick = async () => {
        const bank = $("bk").value.trim(),
          holder = $("bh").value.trim(),
          rib = $("br").value.trim();
        if (!bank || !holder || !rib) return alert("Remplissez les 3 champs.");
        const { error } = await sb.from("bank_accounts").insert({ bank, holder, rib });
        if (error) return alert(error.message);
        await loadP();
        notify("Compte bancaire ajouté ✓");
      };

      $("tp").querySelectorAll("[data-bd]").forEach((b) => {
        b.onclick = async () => {
          if (confirm("Supprimer ce compte ?")) {
            await sb.from("bank_accounts").delete().eq("id", b.dataset.bd);
            await loadP();
            notify("Compte supprimé");
          }
        };
      });

      $("tp").querySelectorAll("[data-pf]").forEach((b) => {
        b.onclick = async () => {
          const { data, error } = await sb.storage
            .from("payment-proofs")
            .createSignedUrl(b.dataset.pf, 300);
          if (error) return alert(error.message);
          window.open(data.signedUrl, "_blank", "noopener");
        };
      });

      $("tp").querySelectorAll("[data-v]").forEach((b) => {
        b.onclick = async () => {
          const st = b.dataset.s,
            amt = +($("am" + b.dataset.v).value || 0);
          if (st === "verified" && !(amt > 0)) return alert("Saisissez le montant réellement reçu.");
          if (
            !confirm(
              st === "verified"
                ? "Confirmer que " + amt + " TND ont bien été reçus sur le compte ?"
                : "Rejeter cette preuve ?"
            )
          )
            return;
          const u = (await sb.auth.getUser()).data.user.id;
          const { error } = await sb
            .from("payments")
            .update({
              status: st,
              amount: st === "verified" ? amt : 0,
              verified_by: u,
              verified_at: new Date().toISOString()
            })
            .eq("id", b.dataset.v);
          if (error) return alert(error.message);
          try {
            await sb.from("audit_log").insert({
              actor: u,
              action: "payment_" + st,
              entity: "payment",
              entity_id: b.dataset.v
            });
          } catch (e) {}
          await loadP();
          notify("Paiement mis à jour ✓");
        };
      });
    }

    async function loadF() {
      const { data, error } = await sb
        .from("invoices")
        .select("*")
        .order("issued_at", { ascending: false })
        .limit(300);

      if (error) {
        $("tf").innerHTML = `<div class="msg">${esc(error.message)}</div>`;
        return;
      }

      const invoices = data || [];
      $("stInvoices").textContent = String(invoices.length);
      const credited = new Set(invoices.filter((i) => i.corrects).map((i) => i.corrects));

      $("tf").innerHTML = `<div class="card">
        <div class="row">
          <h3 style="margin: 0; font-size: 24px">Factures et avoirs</h3>
          <button id="csv">Exporter en CSV (comptable)</button>
        </div>
        <p class="small">Une facture émise ne peut plus être modifiée : pour corriger, créez un avoir.</p>
        ${
          invoices
            .map(
              (i) => `<div class="row" style="border-top: 1px solid var(--line); padding: 9px 0">
                <div>
                  <b>${esc(i.number)}</b> · ${i.kind === "credit_note" ? "Avoir" : "Facture"} · ${new Date(
                    i.issued_at
                  ).toLocaleDateString("fr-FR")}<br>
                  <span class="small">${esc(i.snapshot?.customer?.name)} · ${money(
                    i.snapshot?.total_ttc
                  )} TND TTC${credited.has(i.id) ? " · ⚠️ annulée par un avoir" : ""}</span>
                </div>
                <div>
                  <button data-o="${i.id}">Ouvrir</button>
                  ${
                    i.kind === "invoice" && !credited.has(i.id)
                      ? `<button class="r" data-cn="${i.id}">Créer un avoir</button>`
                      : ""
                  }
                </div>
              </div>`
            )
            .join("") || "<p class='small'>Aucune facture pour le moment.</p>"
        }
      </div>`;

      $("tf").querySelectorAll("[data-o]").forEach((b) => {
        b.onclick = () => openInvoicePreview(b.dataset.o);
      });

      $("tf").querySelectorAll("[data-cn]").forEach((b) => {
        b.onclick = async () => {
          const why = prompt("Motif de l'avoir (obligatoire) :");
          if (!why) return;
          const { data: r, error: e } = await sb.rpc("issue_credit_note", {
            p_invoice: b.dataset.cn,
            p_reason: why
          });
          if (e) return alert(e.message);
          await loadF();
          notify("Avoir créé ✓");
          if (r?.id) await openInvoicePreview(r.id);
        };
      });

      $("csv").onclick = () => {
        const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
        const rows = [
          [
            "Numero",
            "Type",
            "Date",
            "Client",
            "Vehicule",
            "Jours",
            "HTVA",
            "Taxe location",
            "TVA",
            "Timbre",
            "TTC",
            "Acompte",
            "Reste",
            "Avoir sur"
          ]
        ];
        invoices.forEach((i) => {
          const s = i.snapshot || {},
            o = s.original || s;
          rows.push([
            i.number,
            i.kind,
            i.issued_at.slice(0, 10),
            s.customer?.name,
            o.vehicle?.name,
            o.days,
            o.subtotal_htva,
            o.levy_total,
            o.vat_amount,
            o.fiscal_stamp,
            s.total_ttc,
            o.deposit_paid,
            o.balance_due,
            s.original_number || ""
          ]);
        });
        const blob = new Blob(["\ufeff" + rows.map((r) => r.map(q).join(";")).join("\n")], {
          type: "text/csv"
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "factures.csv";
        a.click();
      };
    }

    /* =========================================================================
       6. PARAMÈTRES GÉNÉRAUX
       ========================================================================= */
    const SL = {
      vat_rate: "TVA (%) : à confirmer par le comptable",
      deposit_enabled: "Acompte activé (true/false)",
      deposit_pct: "Acompte (%)",
      hold_minutes: "Durée de retenue d'une demande (minutes)",
      min_days: "Durée minimale de location (jours)",
      levy_per_day: "Taxe par jour et par véhicule (TND)",
      levy_vat_treatment: "Traitement TVA de la taxe : to_confirm / outside_vat / subject_to_vat",
      fiscal_stamp_enabled: "Timbre fiscal actif (true/false)",
      fiscal_stamp_amount: "Montant du timbre (TND)",
      company_name: "Société : nom",
      company_address: "Société : adresse",
      company_tax_id: "Société : matricule fiscal",
      company_phone: "Société : téléphone",
      company_email: "Société : e-mail",
      invoice_footer: "Pied de facture (texte libre)",
      whatsapp: "WhatsApp (chiffres, ex 21621289073)",
      tiktok: "Lien TikTok",
      facebook: "Lien Facebook"
    };

    async function loadS() {
      const { data, error } = await sb.from("settings").select("*").order("key");
      if (error) {
        $("ts").innerHTML = `<div class="msg">${esc(error.message)}</div>`;
        return;
      }

      $("ts").innerHTML = `<div class="card">
        <h3 style="margin-bottom: 6px; font-size: 24px">Paramètres</h3>
        <p class="small">Modifiables sans toucher au code. Taxes et TVA : à valider avec votre comptable.</p>
        ${(data || [])
          .map(
            (r) => `<div style="margin: 10px 0">
              <label class="small">${esc(SL[r.key] || r.key)}</label>
              <input data-k="${esc(r.key)}" value="${esc(r.value)}" />
            </div>`
          )
          .join("")}
        <button class="g" id="ssave">Enregistrer les paramètres</button>
      </div>`;

      $("ssave").onclick = async () => {
        const rows = [...$("ts").querySelectorAll("[data-k]")].map((i) => ({
          key: i.dataset.k,
          value: i.value.trim(),
          updated_at: new Date().toISOString()
        }));
        const btn = $("ssave");
        btn.disabled = true;
        const { error: e } = await sb.from("settings").upsert(rows);
        btn.disabled = false;
        if (e) return alert(e.message);
        try {
          const actor = (await sb.auth.getUser()).data.user.id;
          await sb.from("audit_log").insert({
            actor,
            action: "settings_changed",
            entity: "settings"
          });
        } catch (err) {}
        btn.textContent = "Enregistré ✓";
        notify("Paramètres enregistrés en direct ✓");
        setTimeout(() => {
          btn.textContent = "Enregistrer les paramètres";
        }, 1600);
      };
    }

    boot();
  </script>
</body>
</html>
